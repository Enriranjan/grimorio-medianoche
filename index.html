<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grimorio de Medianoche</title>
<meta name="theme-color" content="#0e0a15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grimorio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
@font-face{font-family:'Pirata One';src:url(fonts/pirata-one.woff2) format('woff2');font-display:swap}
@font-face{font-family:'IM Fell English';src:url(fonts/im-fell-english.woff2) format('woff2');font-display:swap}
@font-face{font-family:'IM Fell English SC';src:url(fonts/im-fell-english-sc.woff2) format('woff2');font-display:swap}
/* Idea de composición: app de una pantalla con barra inferior; el grimorio es un círculo de fichas sobre un anillo de runas; el resto son hojas de pergamino oscuro. */
:root{
  --ink:#0e0a15;
  --ink2:#171021;
  --ink3:#251b34;
  --line:#3d2e50;
  --bone:#efe4cb;
  --dim:#b5a9c0;
  --ember:#f28a1f;
  --town:#7cc4ea;
  --out:#5fd6b0;
  --min:#e8648a;
  --dem:#e03048;
  --parch:#eadcb6;
  --parch-ink:#2b1a12;
  --display:'Pirata One',Georgia,serif;
  --body:'IM Fell English',Georgia,serif;
  --label:'IM Fell English SC',Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--bone);font:18px/1.4 var(--body);overflow:hidden;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
  background:
   radial-gradient(40% 30% at 20% 85%,rgba(242,138,31,.10),transparent 70%),
   radial-gradient(45% 35% at 85% 15%,rgba(124,196,234,.07),transparent 70%),
   radial-gradient(60% 40% at 50% 100%,rgba(120,70,160,.18),transparent 70%);
  animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,0,0)}to{transform:translate3d(3%,-2%,0)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}.flame{animation:none!important}}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.lbl{font-family:var(--label);letter-spacing:.06em;color:var(--dim);font-size:14px}

#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line);background:rgba(14,10,21,.85)}
header.top h1{font-size:22px;color:var(--ember);line-height:1;flex:1;text-wrap:balance}
.chip{font-family:var(--label);font-size:15px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--ink2);white-space:nowrap}
.chip.night{border-color:#5b4a8a}
.chip.dayc{border-color:var(--ember)}
.ghostbtn{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-family:var(--label);font-size:14px}
.ghostbtn[aria-pressed="true"]{border-color:var(--ember);color:var(--ember)}

main{flex:1;overflow:auto;padding:16px 14px 28px;-webkit-overflow-scrolling:touch}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
nav.bar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:rgba(14,10,21,.95);padding-bottom:env(safe-area-inset-bottom)}
nav.bar button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--label);font-size:14px;color:var(--dim);position:relative}
nav.bar button b{font-weight:400;font-size:22px;line-height:1.1;font-family:Georgia,serif}
nav.bar button[aria-current="true"]{color:var(--ember)}
nav.bar button[aria-current="true"]::after{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--ember);box-shadow:0 0 10px var(--ember)}

.panel{background:linear-gradient(180deg,var(--ink2),#130d1c);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h2{font-size:24px;color:var(--bone);margin-bottom:6px}
.panel p{margin:.3em 0}
.sub{color:var(--dim);font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--ink3);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-family:var(--label);font-size:16px}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#1b0e02;font-weight:700}
.btn.danger{border-color:var(--dem);color:#ff8d9b}
.btn.sm{padding:5px 10px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.block{width:100%;padding:13px;font-size:18px}
input[type=text],select,textarea{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:64px;resize:vertical}

/* Preparar */
.plist{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;align-items:center;gap:8px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:5px 8px}
.plist .seat{font-family:var(--display);color:var(--ember);width:1.6em;text-align:center}
.plist .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.comp span{font-family:var(--label);font-size:15px;padding:3px 10px;border-radius:8px;border:1px solid var(--tc);color:var(--tc)}
.t-town{--tc:var(--town)}.t-out{--tc:var(--out)}.t-min{--tc:var(--min)}.t-dem{--tc:var(--dem)}
.pick{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-top:1px solid var(--line)}
.pick input{margin-top:5px;accent-color:var(--ember);width:18px;height:18px;flex:none}
.pick .ic{font-size:24px;flex:none;width:1.4em;text-align:center}
.pick .tx b{font-weight:400;color:var(--tc);font-family:var(--label)}
.pick .tx small{display:block;color:var(--dim);font-size:15px;line-height:1.3}
.legal{font-size:14px;color:var(--dim)}

/* Grimorio */
.ring{position:relative;width:min(100%,540px);aspect-ratio:1;margin:6px auto 26px;container-type:inline-size}
.runes{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--line);stroke-width:.25}
.core{position:absolute;left:50%;top:50%;width:42%;transform:translate(-50%,-50%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.core .moon{font-size:clamp(34px,13cqw,64px);line-height:1;filter:drop-shadow(0 0 14px rgba(242,138,31,.5))}
.core .ph{font-family:var(--display);font-size:clamp(20px,6.5cqw,32px);color:var(--ember);line-height:1}
.core .st{font-size:clamp(12px,3.3cqw,16px);color:var(--dim);line-height:1.25}
.tok{position:absolute;transform:translate(-50%,-50%);width:calc(var(--sz)*1cqw);background:none;border:0;padding:0}
.medal{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 28%,var(--ink3),var(--ink));border:3px solid var(--tc,var(--line));box-shadow:0 0 0 2px var(--ink),0 0 16px color-mix(in srgb,var(--tc,var(--line)) 40%,transparent);font-size:calc(var(--sz)*.5cqw);line-height:1;position:relative}
.tname{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;white-space:nowrap;max-width:7em;overflow:hidden;text-overflow:ellipsis;font-size:clamp(11px,calc(var(--sz)*.19cqw),15px);text-shadow:0 1px 3px #000;background:rgba(14,10,21,.7);padding:0 4px;border-radius:5px}
.tok.dead .medal{filter:grayscale(1) brightness(.55)}
.tok.dead .tname{text-decoration:line-through;color:var(--dim)}
.tok.dead .medal::after{content:"†";position:absolute;inset:0;display:grid;place-items:center;font-size:.8em;color:#fff;opacity:.85;font-family:Georgia,serif}
.pip{position:absolute;right:-2px;bottom:-2px;width:.7em;height:.7em;min-width:9px;min-height:9px;border-radius:50%;background:var(--bone);border:2px solid var(--ink);font-size:inherit}
.bdg{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--ember);color:#1b0e02;font:700 12px/20px Georgia,serif;text-align:center;padding:0 4px}
.mask{position:absolute;left:-5px;top:-5px;font-size:15px;line-height:1}
.verdict{border:1px solid var(--ember);background:rgba(242,138,31,.1);border-radius:12px;padding:10px 12px;color:var(--bone)}
.legend{display:flex;gap:8px 14px;flex-wrap:wrap;justify-content:center;font-family:var(--label);font-size:14px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tc);margin-right:5px}

/* Noche */
.step{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;padding:12px;border:1px solid var(--line);border-left:4px solid var(--tc,var(--line));border-radius:12px;background:var(--ink2)}
.step.done{opacity:.5}
.step .ic{font-size:30px;line-height:1;grid-row:span 3}
.step h3{font-size:21px;color:var(--tc,var(--bone))}
.step .who{font-size:16px}
.step .rem{color:var(--dim);font-size:16px;grid-column:2/4}
.step .btn{grid-row:1;grid-column:3}
.faro{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.faro span{border:1px dashed var(--line);border-radius:8px;padding:2px 8px;font-size:15px}

/* Dia */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tile b{display:block;font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--ember);font-variant-numeric:tabular-nums}
.tile span{font-family:var(--label);font-size:13px;color:var(--dim)}
.vote{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px}
.vote[aria-pressed="true"]{border-color:var(--ember);background:rgba(242,138,31,.14)}
.vote[disabled]{opacity:.35}
.vote .ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--dim);flex:none;display:grid;place-items:center;font-size:14px}
.vote[aria-pressed="true"] .ck{background:var(--ember);border-color:var(--ember);color:#1b0e02}
.bar2{height:10px;border-radius:5px;background:var(--ink);overflow:hidden;margin:8px 0}
.bar2 i{display:block;height:100%;background:var(--ember)}
.bar2.ok i{background:var(--dem)}
.big{font-family:var(--display);font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.timer{text-align:center}
.timer .big{font-size:72px;color:var(--bone)}
.timer.end .big{color:var(--dem);animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.35}}
.nomli{padding:6px 0;border-top:1px solid var(--line);font-size:16px}

/* Hojas y tarjetas */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.overlay.center{align-items:center;padding:16px}
.bd{position:absolute;inset:0;background:rgba(5,3,9,.78)}
.sheet{position:relative;width:min(100%,560px);max-height:90%;overflow:auto;background:var(--ink2);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet .hd{display:flex;gap:8px;align-items:center}
.sheet .hd input{font-family:var(--display);font-size:24px}
.field{display:flex;flex-direction:column;gap:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:15px}
.chipb[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:#1b0e02}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pbtn{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center}
.pbtn.seen{opacity:.55}
.pbtn b{display:block;font-family:var(--display);font-weight:400;font-size:22px}
.cover{position:relative;width:min(100%,380px);text-align:center;padding:30px 20px;background:var(--ink2);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:14px;align-items:center}
.cover .ph{font-size:64px;line-height:1}
.card{position:relative;width:min(100%,360px);background:radial-gradient(120% 90% at 50% 0,#f3e8c6,var(--parch) 60%,#cdb985);color:var(--parch-ink);border-radius:18px;padding:22px 20px 20px;text-align:center;border:3px solid var(--tc);box-shadow:0 0 0 5px var(--ink),0 0 0 7px var(--tc),0 20px 50px rgba(0,0,0,.6)}
.card .ct{font-family:var(--label);letter-spacing:.14em;font-size:15px;color:var(--tc);filter:brightness(.62) saturate(1.4)}
.card .ci{font-size:84px;line-height:1.15}
.card h2{font-size:32px;color:var(--parch-ink)}
.card .ab{font-size:19px;margin:10px 0 0}
.card .ex{margin-top:12px;padding-top:10px;border-top:1px dashed rgba(43,26,18,.4);font-size:17px;text-align:left}
.cardwrap{position:relative;display:flex;flex-direction:column;gap:14px;align-items:center;max-height:100%;overflow:auto;padding:6px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;background:var(--ember);color:#1b0e02;padding:9px 16px;border-radius:12px;font-family:var(--label);max-width:90%;text-align:center}
.empty{text-align:center;padding:30px 10px;color:var(--dim)}
.flame{display:inline-block;animation:flick 2.4s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.06) rotate(2deg)}100%{transform:scale(.98) rotate(-1deg)}}

/* QR y vista de jugador */
.qrbox{position:relative;width:min(100%,400px);max-height:100%;overflow:auto;text-align:center;padding:20px 18px;background:var(--ink2);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.qrbox h2{font-size:34px;color:var(--ember);line-height:1}
.qrframe{width:min(80vw,320px);aspect-ratio:1;padding:10px;background:#fffaf0;border-radius:14px;border:3px solid var(--ember);box-shadow:0 0 0 5px var(--ink),0 0 30px rgba(242,138,31,.35)}
.qrframe svg{display:block;width:100%;height:100%}
.card::before,.card::after{content:"✦";position:absolute;top:10px;color:var(--tc);filter:brightness(.7);font-size:18px}
.card::before{left:14px}.card::after{right:14px}
.card .div{height:1px;background:linear-gradient(90deg,transparent,rgba(43,26,18,.55),transparent);margin:12px 0 8px}
.card .wake{font-size:16px;margin:0;opacity:.82}
.pv{position:fixed;inset:0;z-index:2;overflow:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.pvbox{width:min(100%,400px);margin:auto;display:flex;flex-direction:column;gap:16px}
.pvtop{text-align:center}
.pvtop .lbl{color:var(--ember);letter-spacing:.14em}
.scene{perspective:1500px}
.flip{display:grid;transition:transform .85s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.scene.on .flip{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex}
.face.front{transform:rotateY(180deg)}
.face .card{width:100%}
.cardback{width:100%;min-height:460px;border-radius:18px;border:3px solid var(--ember);background:radial-gradient(90% 60% at 50% 30%,#2c1e40,var(--ink) 75%);box-shadow:0 0 0 5px var(--ink),0 0 0 7px var(--line),0 24px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:26px;position:relative;overflow:hidden}
.cardback .runes{opacity:.9;stroke:var(--ember);stroke-width:.3;inset:6%;width:88%;height:88%}
.cardback>*:not(.runes){position:relative}
.cardback .hi{font-family:var(--display);font-size:38px;color:var(--bone);line-height:1.05}
.cardback .tap{font-family:var(--label);color:var(--ember);letter-spacing:.08em}
.cardback .ph{font-size:70px;line-height:1}
.goal{border:1px solid var(--tc);border-radius:14px;padding:12px 14px;background:rgba(0,0,0,.25);text-align:center}
.goal b{font-family:var(--label);font-weight:400;color:var(--tc);letter-spacing:.08em;display:block;font-size:15px}
.goal[hidden]{display:none}
.embers{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.embers span{position:absolute;bottom:-12px;width:4px;height:4px;border-radius:50%;background:var(--ember);box-shadow:0 0 8px var(--ember);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}12%{opacity:.85}100%{transform:translate(24px,-108vh);opacity:0}}
.secret{text-align:center;font-size:14px;color:var(--dim)}
.pvh{font-size:38px;color:var(--ember);line-height:1;text-align:center}
@media (prefers-reduced-motion:reduce){.flip{transition:none}.embers{display:none}}

/* Libro de personajes */
.pvbox.wide{width:min(100%,640px)}
.lst{display:flex;flex-direction:column;gap:12px}
.lst h1{font-size:34px;color:var(--ember);line-height:1;text-align:center}
.th{font-size:26px;margin-top:10px;color:var(--tc)}
.rle{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px;border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:12px;background:var(--ink2)}
.rle.own{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember),0 0 24px rgba(242,138,31,.3)}
.ri{font-size:34px;line-height:1}
.rb h3{font-size:22px;color:var(--tc)}
.you{font-family:var(--label);font-size:13px;color:#1b0e02;background:var(--ember);padding:1px 8px;border-radius:999px;vertical-align:middle;margin-left:6px;letter-spacing:.04em}
.rt{font-family:var(--label);font-size:13px;color:var(--dim);letter-spacing:.08em}
.rb p{margin:.3em 0 0}
.rw{color:var(--dim);font-size:15px}
.fil{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.rules{border:1px solid var(--line);border-radius:12px;background:var(--ink2);padding:10px 14px}
.rules summary{cursor:pointer;font-family:var(--label);color:var(--ember);letter-spacing:.06em}
.rules ul{margin:8px 0 2px;padding-left:20px}
.rules li{margin:4px 0}
</style>
</head>
<body>
<div id="app"></div>
<script src="qrcode.js"></script>
<script>
/* ============ Datos: script propio "La Noche de las Ánimas" ============ */
const TEAMS={
  town:{n:'Aldeano',p:'Aldeanos'},
  out:{n:'Marginado',p:'Marginados'},
  min:{n:'Esbirro',p:'Esbirros'},
  dem:{n:'Demonio',p:'Demonios'}
};
/* f = orden la primera noche, o = orden en las demás noches (0 = no despierta) */
const ROLES=[
 {id:'vidente',t:'town',i:'🔮',n:'La Vidente de Cenizas',a:'Cada noche eliges a 2 jugadores y aprendes si alguno de ellos es el Demonio. Hay un jugador bueno que siempre te aparece como Demonio.',f:90,o:70,r:'Despierta a la Vidente: elige a 2 jugadores. Asiente si alguno es el Demonio o la falsa pista; si no, niega. Envenenada o borracha: responde lo que quieras.'},
 {id:'sepulturero',t:'town',i:'⚰️',n:'El Sepulturero',a:'Cada noche, menos la primera, aprendes qué personaje fue ejecutado ese día.',f:0,o:80,r:'Si hubo ejecución hoy, enséñale la ficha del ejecutado. Si no la hubo, no lo despiertes.'},
 {id:'farolero',t:'town',i:'🏮',n:'El Farolero',a:'Cada noche aprendes cuántos de tus 2 vecinos vivos son malvados.',f:80,o:60,r:'Indica 0, 1 o 2 con los dedos según sus vecinos vivos más cercanos.'},
 {id:'bibliotecaria',t:'town',i:'📚',n:'La Bibliotecaria Embrujada',a:'La primera noche aprendes que 1 de 2 jugadores es un Marginado concreto, o que no hay ninguno.',f:60,o:0,r:'Enséñale una ficha de Marginado y señala a 2 jugadores, uno de los cuales la tiene. Si no hay Marginados, haz el gesto de cero.'},
 {id:'cronista',t:'town',i:'📜',n:'El Cronista',a:'La primera noche aprendes que 1 de 2 jugadores es un Aldeano concreto.',f:50,o:0,r:'Enséñale una ficha de Aldeano y señala a 2 jugadores, uno de los cuales la tiene.'},
 {id:'detective',t:'town',i:'🔍',n:'El Detective de Sombras',a:'La primera noche aprendes que 1 de 2 jugadores es un Esbirro concreto.',f:70,o:0,r:'Enséñale una ficha de Esbirro y señala a 2 jugadores, uno de los cuales la tiene.'},

const R=Object.fromEntries(ROLES.map(r=>[r.id,r]));
const COMP={5:[3,0,1,1],6:[3,1,1,1],7:[5,0,1,1],8:[5,1,1,1],9:[5,2,1,1],10:[7,0,2,1],11:[7,1,2,1],12:[7,2,2,1],13:[9,0,3,1],14:[9,1,3,1],15:[9,2,3,1]};
const CHIPS=['Envenenado','Protegido','Maldito','Marcado','Falsa pista','Sin habilidad','Habilidad usada','Muere esta noche'];

function fresh(){return{v:1,players:NAMES.map((n,i)=>({id:i+1,name:n,role:null,shown:null,alive:true,ghost:true,rem:[],note:'',seen:false})),nextId:NAMES.length+1,pool:ROLES.map(r=>r.id),started:false,day:1,night:true,done:{},noms:[],nomd:[],nomr:[],block:null,bluffs:[],hide:false,tab:'setup'}}
function load(){try{const j=localStorage.getItem(KEY);if(j){const s=JSON.parse(j);if(s&&s.v===1)return s}}catch(e){}return null}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=id=>S.players.find(p=>p.id===+id);
const teamOf=p=>p&&p.role&&R[p.role]?R[p.role].t:null;
const aliveN=()=>S.players.filter(p=>p.alive).length;
const thr=()=>Math.ceil(aliveN()/2);
const names=a=>a.length?a.map(p=>esc(p.name)).join(', '):'nadie';
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(m){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function commit(){save();render()}

/* ============ Lógica de partida ============ */
function deal(){
  const n=S.players.length,c=COMP[n];
  if(!c){toast('Hacen falta entre 5 y 15 jugadores');return}
  let [Tn,O,M,D]=c;
  const pool=t=>shuffle(ROLES.filter(r=>r.t===t&&S.pool.includes(r.id)));
  const dem=pool('dem'),min=pool('min');
  if(dem.length<D){toast('Activa al menos un Demonio');return}
  if(min.length<M){toast('Activa al menos '+M+' Esbirro'+(M>1?'s':''));return}
  const minPick=min.slice(0,M);
  if(minPick.some(r=>r.mod)){O+=2;Tn-=2}
  const out=pool('out'),town=pool('town');
  if(out.length<O){toast('Faltan Marginados activos: necesitas '+O);return}
  if(town.length<Tn){toast('Faltan Aldeanos activos: necesitas '+Tn);return}
  const chosen=[...dem.slice(0,D),...minPick,...out.slice(0,O),...town.slice(0,Tn)];
  const used=new Set(chosen.map(r=>r.id));
  const order=shuffle(chosen);
  S.players.forEach((p,i)=>{p.role=order[i].id;p.shown=null;p.alive=true;p.ghost=true;p.rem=[];p.seen=false});
  const spare=shuffle(ROLES.filter(r=>r.t==='town'&&!used.has(r.id)));
  S.players.forEach(p=>{if(p.role==='borracho'){const r=spare.shift()||shuffle(ROLES.filter(x=>x.t==='town'))[0];p.shown=r.id;used.add(r.id)}});
  S.bluffs=shuffle(ROLES.filter(r=>(r.t==='town'||r.t==='out')&&!used.has(r.id))).slice(0,3).map(r=>r.id);
  Object.assign(S,{started:true,gid:newGid(),day:1,night:true,done:{},noms:[],nomd:[],nomr:[],block:null,tab:'grim'});
  U.sheet=null;U.voting=null;U.votes=[];U.gqr=true;
  commit();toast('Roles repartidos. Enseña el QR de la partida');
}
function resetGame(){
  S.started=false;S.gid=null;S.day=1;S.night=true;S.done={};S.noms=[];S.nomd=[];S.nomr=[];S.block=null;S.bluffs=[];S.tab='setup';
  S.players.forEach(p=>{p.role=null;p.shown=null;p.alive=true;p.ghost=true;p.rem=[];p.note='';p.seen=false});
  U.sheet=null;U.voting=null;U.votes=[];U.gqr=false;commit();
}
function phase(){
  if(S.night){S.night=false;S.done={};S.noms=[];S.nomd=[];S.nomr=[];S.block=null;U.voting=null;U.votes=[];S.tab='day'}
  else{S.night=true;S.day++;S.done={};S.tab='night'}
  commit();
}
function verdict(){
  if(!S.started)return '';
  const demAlive=S.players.some(p=>p.alive&&teamOf(p)==='dem');
  if(!demAlive)return 'No queda ningún Demonio vivo. Ganan los Aldeanos, salvo que una Dama del Velo siga viva con 5 o más jugadores en pie.';
  if(aliveN()<=2)return 'Quedan 2 jugadores vivos y el Demonio sigue entre ellos. Ganan los malvados.';
  return '';
}

/* ============ Pasos de la noche ============ */
function nightSteps(){
  const first=S.day===1&&S.night,out=[];
  out.push({id:'dusk',o:0,i:'🌑',n:'Anochecer',txt:'Pide a todos que cierren los ojos.'});
  ROLES.forEach(r=>{
    const ord=first?r.f:r.o;if(!ord)return;
    const hs=S.players.filter(p=>p.role===r.id||p.shown===r.id);
    if(!hs.some(p=>p.alive))return;
    out.push({id:r.id,o:ord,i:r.i,n:r.n,t:r.t,holders:hs,txt:r.r});
  });
  if(first){
    const mins=S.players.filter(p=>teamOf(p)==='min'),dems=S.players.filter(p=>teamOf(p)==='dem');
    if(mins.length)out.push({id:'minfo',o:30,i:'🕸️',n:'Los Esbirros se reconocen',t:'min',txt:'Despierta a los Esbirros a la vez. Señala al Demonio: '+names(dems)+'. Esbirros: '+names(mins)+'.'});
    if(dems.length)out.push({id:'dinfo',o:41,i:'🩸',n:'El Demonio conoce a sus Esbirros',t:'dem',txt:'Despierta al Demonio. Señala a sus Esbirros: '+names(mins)+'. Enséñale 3 faroles (roles buenos que no están en juego).',bluffs:true});
  }
  out.push({id:'dawn',o:999,i:'🌅',n:'Amanecer',txt:'Abre los ojos y anuncia quién ha muerto esta noche. Marca los fallecidos en el grimorio.'});
  return out.sort((a,b)=>a.o-b.o);
}

  }).join('');
  const live=S.started?`<section class="panel" style="border-color:var(--ember)"><h2>Partida en curso</h2><p class="sub">Enseña el QR de la partida a la mesa: cada jugador lo escanea, elige su nombre y ve su carta.</p><button class="btn primary block" style="margin-top:8px" data-act="gameqr">▣ Mostrar QR de la partida</button></section>`:'';
  return `<div class="wrap">
  ${live}

   <div class="row"><input type="text" id="newname" placeholder="Nombre del jugador" maxlength="24" autocomplete="off" style="flex:1;min-width:140px"><button class="btn" data-act="add">Añadir</button></div>
   <div class="row" style="margin-top:8px"><button class="btn sm" data-act="shuf">Barajar asientos</button><button class="btn sm danger" data-act="clear">Vaciar lista</button></div>
   ${comp}
  </section>
  <section class="panel"><h2>La Noche de las Ánimas</h2><p class="sub">Script propio con ${ROLES.length} personajes. Desmarca los que no quieras que salgan en la partida.</p>${groups}</section>
  <button class="btn primary block" data-act="deal">${S.started?'Volver a repartir roles':'Repartir roles y empezar'}</button>

  </div>`;

function ringSVG(){
  let t='';
  for(let i=0;i<48;i++){const a=i*Math.PI/24,r1=i%4===0?45.6:47,r2=48.6;t+=`<line x1="${(50+r1*Math.cos(a)).toFixed(2)}" y1="${(50+r1*Math.sin(a)).toFixed(2)}" x2="${(50+r2*Math.cos(a)).toFixed(2)}" y2="${(50+r2*Math.sin(a)).toFixed(2)}"/>`}
  return `<svg class="runes" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48.6"/><circle cx="50" cy="50" r="27"/><circle cx="50" cy="50" r="25.6" stroke-dasharray="2.5 1.4"/>${t}</svg>`;
}
function vGrim(){
  const n=S.players.length;if(!n)return `<div class="panel empty">No hay jugadores. Añádelos en Preparar.</div>`;
  const sz=Math.min(19,215/Math.max(n,5)),R0=37;
  const toks=S.players.map((p,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/n,x=50+R0*Math.cos(a),y=50+R0*Math.sin(a);
    const r=p.role?R[p.role]:null,tm=r?r.t:null;
    const glyph=S.hide?'☾':(r?r.i:'?');
    const tc=S.hide||!tm?'var(--dim)':`var(--${tm})`;
    return `<button class="tok ${p.alive?'':'dead'}" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%;--sz:${sz.toFixed(2)};--tc:${tc}" data-act="sheet" data-id="${p.id}" aria-label="${esc(p.name)}${r&&!S.hide?', '+esc(r.n):''}${p.alive?'':', muerto'}"><span class="medal">${glyph}${!p.alive&&p.ghost?'<i class="pip" title="Conserva su voto fantasma"></i>':''}${p.rem.length?`<span class="bdg">${p.rem.length}</span>`:''}${!S.hide&&p.shown?'<span class="mask">🎭</span>':''}</span><span class="tname">${esc(p.name)}</span></button>`;
  }).join('');
  const v=verdict();
  return `<div class="wrap">
   ${v?`<div class="verdict" role="status">${esc(v)}</div>`:''}
   <div class="ring">${ringSVG()}${toks}<div class="core"><div class="moon">${S.night?'🌕':'🎃'}</div><div class="ph">${S.started?(S.night?'Noche ':'Día ')+S.day:'Sin repartir'}</div><div class="st">${aliveN()} vivos · hacen falta ${thr()} votos</div></div></div>
   <div class="legend"><span class="t-town"><i></i>Aldeano</span><span class="t-out"><i></i>Marginado</span><span class="t-min"><i></i>Esbirro</span><span class="t-dem"><i></i>Demonio</span><span>● voto fantasma</span><span>🎭 cree ser otro</span></div>
   ${S.started?`<button class="btn primary block" data-act="phase">${S.night?'☀ Amanece':'☾ Anochece'}</button>`:needStart()}
   <p class="sub" style="text-align:center">Toca una ficha para cambiar su rol, marcarla muerta o poner recordatorios.</p>
  </div>`;
}

function vNight(){
  if(!S.started)return needStart();
  if(!S.night)return `<div class="wrap"><div class="panel empty"><p>Es de día. La noche empieza cuando pulses Anochece.</p><button class="btn primary" data-act="phase">☾ Anochece</button></div></div>`;
  const steps=nightSteps();
  const html=steps.map(s=>{
    const done=S.done[s.id];
    const who=s.holders?s.holders.map(p=>{
      const tags=[];if(!p.alive)tags.push('muerto');if(p.shown===s.id&&p.role!==s.id)tags.push('es el Borracho: su habilidad falla');
      return `<b>${esc(p.name)}</b>${tags.length?` <em>(${tags.join(', ')})</em>`:''}`}).join(', '):'';
    const bl=s.bluffs?`<div class="faro">${S.bluffs.map(id=>`<span>${R[id].i} ${esc(R[id].n)}</span>`).join('')}</div>`:'';
    return `<div class="step ${done?'done':''} ${s.t?'t-'+s.t:''}"><span class="ic" aria-hidden="true">${s.i}</span><h3>${esc(s.n)}</h3><button class="btn sm" data-act="done" data-id="${s.id}" aria-pressed="${!!done}">${done?'Hecho ✓':'Marcar'}</button>${who?`<div class="who">${who}</div>`:'<div></div>'}<div class="rem">${esc(s.txt)}${bl}</div></div>`;
  }).join('');
  const pend=steps.filter(s=>!S.done[s.id]).length;
  return `<div class="wrap"><div class="panel"><h2>Noche ${S.day}${S.day===1?' · primera noche':''}</h2><p class="sub">${pend?pend+' pasos pendientes':'Todos los pasos hechos'}. Orden de despertar para los personajes en juego.</p></div>${html}<button class="btn primary block" data-act="phase">☀ Amanece</button></div>`;
}

  if(!S.started)return needStart();
  const t=thr(),blk=S.block?P(S.block.id):null,v=verdict();
  const timer=`<section class="panel timer ${T.done?'end':''}" id="timerbox"><h2>Cuenta atrás</h2><div class="big" id="tmr">${fmt(T.left)}</div>
   <div class="row" style="justify-content:center;margin-top:10px"><button class="btn" data-act="tstart">${T.end?'Pausar':'Iniciar'}</button><button class="btn" data-act="treset">Reiniciar</button></div>
   <div class="row" style="justify-content:center;margin-top:8px">${[1,3,5,10].map(m=>`<button class="btn sm" data-act="tset" data-m="${m}">${m} min</button>`).join('')}</div></section>`;
  if(S.night)return `<div class="wrap"><div class="panel empty"><p>Es de noche. Las nominaciones se abren al amanecer.</p><button class="btn primary" data-act="phase">☀ Amanece</button></div>${timer}</div>`;
  const tiles=`<div class="tiles"><div class="tile"><b>${aliveN()}</b><span>VIVOS</span></div><div class="tile"><b>${t}</b><span>VOTOS PARA EJECUTAR</span></div><div class="tile"><b>${blk?S.block.n:'–'}</b><span>${blk?'EN LA HOGUERA: '+esc(blk.name).toUpperCase():'HOGUERA VACÍA'}</span></div></div>`;
  let nomUI;
  if(U.voting){

/* ---- Datos de la carta y enlace del jugador ---- */
function b64e(s){const b=new TextEncoder().encode(s);let x='';b.forEach(c=>x+=String.fromCharCode(c));return btoa(x).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const x=atob(t),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return new TextDecoder().decode(a)}
function cardData(p){
  const id=p.shown||p.role,idx=ROLES.findIndex(r=>r.id===id),d={r:idx,n:p.name,m:[],d:[],b:[]};
  if(idx>=0&&!p.shown){
    const t=ROLES[idx].t,dems=S.players.filter(q=>teamOf(q)==='dem'),mins=S.players.filter(q=>teamOf(q)==='min');
    if(t==='min'){d.d=dems.map(q=>q.name);d.m=mins.filter(q=>q.id!==p.id).map(q=>q.name)}
    if(t==='dem'){d.m=mins.map(q=>q.name);d.b=S.bluffs.map(b=>ROLES.findIndex(r=>r.id===b))}
  }
  return d;
}
/* El QR de la partida lleva toda la mesa: nombre y carta visible de cada jugador. Cada móvil monta su carta al elegir nombre. */
const newGid=()=>Math.random().toString(36).slice(2,8);
const encGame=()=>b64e(JSON.stringify([2,S.gid||'',poolMask().toString(36),S.bluffs.map(b=>ROLES.findIndex(r=>r.id===b)),S.players.map(p=>[p.name,ROLES.findIndex(r=>r.id===(p.shown||p.role))])]));
function decGame(t){const a=JSON.parse(b64d(t));if(a[0]!==2)throw new Error('v');return{g:a[1],mask:parseInt(a[2],36),b:a[3]||[],ps:a[4]||[]}}
function gameCard(G,i){
  const p=G.ps[i],r=ROLES[p[1]],d={r:p[1],n:p[0],m:[],d:[],b:[]};
  const by=t=>G.ps.filter((q,j)=>j!==i&&ROLES[q[1]]&&ROLES[q[1]].t===t).map(q=>q[0]);
  if(r&&r.t==='min'){d.d=by('dem');d.m=by('min')}
  if(r&&r.t==='dem'){d.m=by('min');d.b=G.b}
  return d;
}
function defaultBase(){return /^https?:$/.test(location.protocol)?location.href.split('#')[0].split('?')[0]:''}
function baseUrl(){return String(S.baseUrl||defaultBase()).trim().split('#')[0]}
const poolMask=()=>ROLES.reduce((m,r,i)=>S.pool.includes(r.id)?m|(1<<i):m,0);
function gameUrl(){const b=baseUrl();return b&&S.started?b+'#p='+encGame():''}
function rolesUrl(){const b=baseUrl();return b?b+'#roles='+poolMask().toString(36):''}
function qrSVG(text){
  try{
    const q=qrcode(0,'M');q.addData(text);q.make();
    const n=q.getModuleCount(),m=4;let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" role="img" aria-label="Código QR de la tarjeta"><rect width="100%" height="100%" fill="#fffaf0"/><path d="${d}" fill="#1a0f24"/></svg>`;
  }catch(e){return ''}
}

      <div class="lbl">La Noche de las Ánimas</div><h2>QR de la partida</h2>
      ${svg?`<div class="qrframe">${svg}</div><p class="sub">Escanead este código con la cámara del móvil. Cada uno toca su nombre, confirma que es él y ve su carta en secreto.</p>`:`<p class="verdict">No se puede generar el QR. Revisa la dirección de la web en la pestaña Tarjetas.</p>`}
      <p class="sub" style="font-size:14px">${S.players.length} jugadores. Si cambias algún rol o asiento, vuelve a enseñar este QR.</p>
      <div class="row" style="justify-content:center"><button class="btn sm" data-act="copygame" ${url?'':'disabled'}>Copiar enlace</button><button class="btn primary" data-act="closegqr">Cerrar</button></div>
    </div></div>`;
  }
  if(U.confirm){
    h+=`<div class="overlay center" role="alertdialog" aria-modal="true"><div class="bd" data-act="no"></div><div class="cover"><h2>${esc(U.confirm.t)}</h2><div class="row"><button class="btn danger" data-act="yes">Confirmar</button><button class="btn" data-act="no">Cancelar</button></div></div></div>`;
  }
  return h;
}

function render(){
  const old=$('#main'),st=old?old.scrollTop:0,sh=$('#sheetbody'),sst=sh?sh.scrollTop:0;
  const views={setup:vSetup,grim:vGrim,night:vNight,day:vDay,cards:vCards};
  $('#app').innerHTML=header()+`<main id="main">${(views[S.tab]||vSetup)()}</main>`+nav()+overlays();
  const m=$('#main');if(m)m.scrollTop=st;
  const s2=$('#sheetbody');if(s2)s2.scrollTop=sst;
  if(U.focus){const f=document.getElementById(U.focus);if(f)f.focus();U.focus=null}
}

/* ============ Acciones ============ */
const A={
  tab:(d)=>{S.tab=d.k;commit()},
  hide:()=>{S.hide=!S.hide;commit()},
  add:()=>{const i=$('#newname');const v=(i&&i.value||'').trim();if(!v){toast('Escribe un nombre');return}S.players.push({id:S.nextId++,name:v,role:null,shown:null,alive:true,ghost:true,rem:[],note:'',seen:false});U.focus='newname';commit()},
  up:(d)=>{const a=S.players,i=a.findIndex(p=>p.id===+d.id);if(i>0){[a[i-1],a[i]]=[a[i],a[i-1]];commit()}},
  down:(d)=>{const a=S.players,i=a.findIndex(p=>p.id===+d.id);if(i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];commit()}},
  seatl:(d)=>A.up(d),seatr:(d)=>A.down(d),
  rm:(d)=>{S.players=S.players.filter(p=>p.id!==+d.id);commit()},
  rm2:(d)=>{U.confirm={t:'¿Quitar a '+P(d.id).name+' de la partida?',act:()=>{S.players=S.players.filter(p=>p.id!==+d.id);U.sheet=null}};render()},
  shuf:()=>{S.players=shuffle(S.players);commit()},
  clear:()=>{U.confirm={t:'¿Vaciar la lista de jugadores?',act:()=>{S.players=[];S.started=false}};render()},
  deal:()=>{if(S.started){U.confirm={t:'Ya hay una partida en curso. ¿Repartir de nuevo y empezar otra?',act:deal};render()}else deal()},
  reset:()=>{U.confirm={t:'¿Borrar roles y empezar una partida nueva con estos jugadores?',act:resetGame};render()},
  yes:()=>{const c=U.confirm;U.confirm=null;if(c){c.act();commit()}else render()},
  no:()=>{U.confirm=null;render()},
  sheet:(d)=>{U.sheet=+d.id;render()},
  closesheet:()=>{U.sheet=null;render()},
  alive:(d)=>{const p=P(d.id);p.alive=!p.alive;if(p.alive)p.ghost=true;commit()},
  ghostv:(d)=>{const p=P(d.id);p.ghost=!p.ghost;commit()},
  chip:(d)=>{const p=P(d.id),i=p.rem.indexOf(d.c);if(i>=0)p.rem.splice(i,1);else p.rem.push(d.c);commit()},
  phase:()=>phase(),
  done:(d)=>{S.done[d.id]=!S.done[d.id];commit()},
  showcard:(d)=>{U.card=+d.id;U.stage=0;U.sheet=null;U.gqr=false;render()},
  gameqr:()=>{U.gqr=true;U.sheet=null;U.card=null;render()},
  closegqr:()=>{U.gqr=false;render()},
  copygame:()=>{const u=gameUrl();try{navigator.clipboard.writeText(u).then(()=>toast('Enlace copiado'),()=>toast('No se pudo copiar el enlace'))}catch(e){toast('No se pudo copiar el enlace')}},
  ppick:(d)=>{PV.conf=+d.i;renderPick()},
  pno:()=>{PV.conf=null;renderPick()},
  pyes:()=>{if(PV.conf==null)return;pickSeat(PV.conf);renderPlayer();const pv=$('.pv');if(pv)pv.scrollTop=0},
  pchange:()=>{try{localStorage.removeItem(YOU)}catch(e){}PV.d=null;PV.conf=null;PV.view='pick';renderPlayer()},
  plist:()=>{PV.view='list';PV.first=true;renderPlayer();const pv=$('.pv');if(pv)pv.scrollTop=0},
  pback:()=>{PV.view=PV.d?'card':'pick';renderPlayer()},
  pfilter:(d)=>{PV.f=d.k;renderList()},
  copyroles:()=>{const u=rolesUrl();try{navigator.clipboard.writeText(u).then(()=>toast('Enlace copiado'),()=>toast('No se pudo copiar el enlace'))}catch(e){toast('No se pudo copiar el enlace')}},
  ptoggle:()=>{
    const sc=$('#scene');if(!sc)return;
    const on=sc.classList.toggle('on');
    $('#ptog').textContent=on?'Ocultar mi rol':'Revelar mi rol';
    const g=$('#pgoal');if(g)g.hidden=!on;
    $('#ffront').setAttribute('aria-hidden',on?'false':'true');$('#fback').setAttribute('aria-hidden',on?'true':'false');
  },
  reveal:()=>{U.stage=1;render()},
  hidecard:()=>{const p=P(U.card);if(p)p.seen=true;U.card=null;U.stage=0;commit()},
  closecard:()=>{U.card=null;U.stage=0;render()},
  openvote:()=>{if(!U.from||!U.to)return;U.voting={from:+U.from,to:+U.to};U.votes=[];render()},
  cancelvote:()=>{U.voting=null;U.votes=[];render()},
  vote:(d)=>{const id=+d.id,i=U.votes.indexOf(id);if(i>=0)U.votes.splice(i,1);else U.votes.push(id);render()},
  closevote:()=>{
    const v=U.voting,cnt=U.votes.length,t=thr();if(!v)return;
    S.noms.push({from:v.from,to:v.to,n:cnt,t});S.nomd.push(v.to);S.nomr.push(v.from);
    U.votes.forEach(id=>{const p=P(id);if(p&&!p.alive)p.ghost=false});
    let msg=cnt+' voto'+(cnt===1?'':'s')+': no alcanza el umbral ('+t+')';
    if(cnt>=t){
      if(!S.block||cnt>S.block.n){S.block={id:v.to,n:cnt};msg=P(v.to).name+' va a la hoguera con '+cnt+' votos'}
      else if(cnt===S.block.n){S.block=null;msg='Empate: nadie queda en la hoguera'}
      else msg='No supera los '+S.block.n+' votos de la hoguera';
    }
    U.voting=null;U.votes=[];commit();toast(msg);
  },
  exec:()=>{const p=P(S.block.id);p.alive=false;S.block=null;commit();toast(p.name+' ha sido ejecutado. Revisa si termina la partida')},
  spare:()=>{S.block=null;commit()},
  tstart:()=>{
    try{T.ac=T.ac||new (window.AudioContext||window.webkitAudioContext)();T.ac.resume&&T.ac.resume()}catch(e){}
    if(T.end){T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));T.end=null}
    else{if(T.left<=0)T.left=T.total;T.done=false;T.end=Date.now()+T.left*1000}
    render();
  },
  treset:()=>{T.end=null;T.left=T.total;T.done=false;render()},
  tset:(d)=>{T.total=T.left=+d.m*60;T.end=null;T.done=false;render()}
};
const C={
  baseurl:(d,el)=>{S.baseUrl=el.value.trim();commit()},
  pool:(d,el)=>{const i=S.pool.indexOf(d.id);if(el.checked&&i<0)S.pool.push(d.id);if(!el.checked&&i>=0)S.pool.splice(i,1);commit()},
  from:(d,el)=>{U.from=el.value},
  to:(d,el)=>{U.to=el.value},
  pname:(d,el)=>{const p=P(U.sheet);if(p&&el.value.trim()){p.name=el.value.trim();commit()}},
  prole:(d,el)=>{const p=P(U.sheet);p.role=el.value||null;
    if(p.role!=='borracho')p.shown=null;
    else if(!p.shown){const used=new Set(S.players.map(q=>q.role));const c=shuffle(ROLES.filter(r=>r.t==='town'&&!used.has(r.id)))[0];if(c)p.shown=c.id}
    commit()},
  pshown:(d,el)=>{const p=P(U.sheet);p.shown=el.value||null;commit()},
  pnote:(d,el)=>{const p=P(U.sheet);p.note=el.value;save()}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName))return;
  const f=A[el.dataset.act];if(f)f(el.dataset,el);
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-chg]');if(!el)return;
  const f=C[el.dataset.chg];if(f)f(el.dataset,el);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='newname'){e.preventDefault();A.add()}
  if(e.key==='Escape'){if(PV.conf!=null){A.pno()}else if(!S){}else if(U.confirm){A.no()}else if(U.gqr){A.closegqr()}else if(U.sheet){A.closesheet()}else if(U.card){A.closecard()}}
});

/* ============ Temporizador ============ */
function beep(){
  try{
    const a=T.ac;if(!a)return;
    [0,0.35,0.7].forEach(dt=>{const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=392;o.connect(g);g.connect(a.destination);const t0=a.currentTime+dt;g.gain.setValueAtTime(.25,t0);g.gain.exponentialRampToValueAtTime(.001,t0+.3);o.start(t0);o.stop(t0+.32)});
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
setInterval(()=>{
  if(!T.end)return;
  T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  const el=$('#tmr');if(el)el.textContent=fmt(T.left);
  if(T.left<=0){T.end=null;T.done=true;beep();const b=$('#timerbox');if(b)b.classList.add('end');toast('Se acabó el tiempo')}
},250);

try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
/* ============ Arranque ============ */
function start(d){
  const m=/^#p=([\w-]+)$/.exec(location.hash),l=/^#roles(?:=([0-9a-z]+))?$/.exec(location.hash);
  if(l){PV.d=null;PV.view='list';PV.mask=l[1]?parseInt(l[1],36):null;renderList();return}
  if(m){
    try{PV.G=decGame(m[1]);PV.mask=PV.G.mask}catch(e){PV.G=null}
    if(!PV.G||!PV.G.ps.length){PV.G=null;PV.view='card';renderPlayer();return}
    PV.view='pick';
    try{
      const y=JSON.parse(localStorage.getItem(YOU)||'null'),ps=PV.G.ps;
      if(y&&y.g&&y.g===PV.G.g){const i=ps[y.i]&&ps[y.i][0]===y.n?y.i:ps.findIndex(q=>q[0]===y.n);if(i>=0)pickSeat(i)}
    }catch(e){}
    renderPlayer();return;
  }
  S=(d&&d.S)||load()||fresh();
  if(!S.players)S=fresh();
  if(S.started&&!S.gid){S.gid=newGid();save()}
  render();
}
window.addEventListener('hashchange',()=>location.reload());
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({S}))}catch(e){}
try{
  if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
  else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
}catch(e){start({})}
</script>
