<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grimorio de Medianoche</title>
<meta name="theme-color" content="#0e0a15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grimorio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
@font-face{font-family:'Pirata One';src:url(fonts/pirata-one.woff2) format('woff2');font-display:swap}
@font-face{font-family:'IM Fell English';src:url(fonts/im-fell-english.woff2) format('woff2');font-display:swap}
@font-face{font-family:'IM Fell English SC';src:url(fonts/im-fell-english-sc.woff2) format('woff2');font-display:swap}
/* Idea de composición: app de una pantalla con barra inferior; el grimorio es un círculo de fichas sobre un anillo de runas; el resto son hojas de pergamino oscuro. */
:root{
  --ink:#0e0a15;
  --ink2:#171021;
  --ink3:#251b34;
  --line:#3d2e50;
  --bone:#efe4cb;
  --dim:#b5a9c0;
  --ember:#f28a1f;
  --town:#7cc4ea;
  --out:#5fd6b0;
  --min:#e8648a;
  --dem:#e03048;
  --parch:#eadcb6;
  --parch-ink:#2b1a12;
  --display:'Pirata One',Georgia,serif;
  --body:'IM Fell English',Georgia,serif;
  --label:'IM Fell English SC',Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--bone);font:18px/1.4 var(--body);overflow:hidden;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
  background:
   radial-gradient(40% 30% at 20% 85%,rgba(242,138,31,.10),transparent 70%),
   radial-gradient(45% 35% at 85% 15%,rgba(124,196,234,.07),transparent 70%),
   radial-gradient(60% 40% at 50% 100%,rgba(120,70,160,.18),transparent 70%);
  animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,0,0)}to{transform:translate3d(3%,-2%,0)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}.flame{animation:none!important}}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.lbl{font-family:var(--label);letter-spacing:.06em;color:var(--dim);font-size:14px}

#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line);background:rgba(14,10,21,.85)}
header.top h1{font-size:clamp(16px,4.4vw,22px);color:var(--ember);line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-family:var(--label);font-size:15px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--ink2);white-space:nowrap}
.chip.night{border-color:#5b4a8a}
.chip.dayc{border-color:var(--ember)}
.ghostbtn{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-family:var(--label);font-size:14px}
.ghostbtn[aria-pressed="true"]{border-color:var(--ember);color:var(--ember)}
.eyebtn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:96px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--ink2);color:var(--bone);font-family:var(--label);font-size:14px;transition:background .3s,border-color .3s,color .3s,box-shadow .3s}
.eyebtn svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eyebtn[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:#1b0e02;box-shadow:0 0 14px rgba(242,138,31,.55)}
@media (max-width:480px){.eyebtn{min-width:0;width:38px;padding:0}.eyebtn span{display:none}}
.tok .medal{transition:filter .35s,opacity .35s}
.ring.veil .tok:not(.dead) .medal{filter:saturate(.3) brightness(.8)}
.veiltag{display:inline-block;margin-top:2px;font-family:var(--label);font-size:clamp(11px,3cqw,14px);color:var(--ember);letter-spacing:.06em}

main{flex:1;overflow:auto;padding:16px 14px 28px;-webkit-overflow-scrolling:touch}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
nav.bar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:rgba(14,10,21,.95);padding-bottom:env(safe-area-inset-bottom)}
nav.bar button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--label);font-size:14px;color:var(--dim);position:relative}
nav.bar button b{font-weight:400;font-size:22px;line-height:1.1;font-family:Georgia,serif}
nav.bar button[aria-current="true"]{color:var(--ember)}
nav.bar button[aria-current="true"]::after{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--ember);box-shadow:0 0 10px var(--ember)}

.panel{background:linear-gradient(180deg,var(--ink2),#130d1c);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h2{font-size:24px;color:var(--bone);margin-bottom:6px}
.panel p{margin:.3em 0}
.sub{color:var(--dim);font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--ink3);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-family:var(--label);font-size:16px}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#1b0e02;font-weight:700}
.btn.danger{border-color:var(--dem);color:#ff8d9b}
.btn.sm{padding:5px 10px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.block{width:100%;padding:13px;font-size:18px}
input[type=text],select,textarea{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:64px;resize:vertical}

/* Preparar */
.plist{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;align-items:center;gap:8px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:5px 8px}
.plist .seat{font-family:var(--display);color:var(--ember);width:1.6em;text-align:center}
.plist .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.comp span{font-family:var(--label);font-size:15px;padding:3px 10px;border-radius:8px;border:1px solid var(--tc);color:var(--tc)}
.t-town{--tc:var(--town)}.t-out{--tc:var(--out)}.t-min{--tc:var(--min)}.t-dem{--tc:var(--dem)}
.pick{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-top:1px solid var(--line)}
.pick input{margin-top:5px;accent-color:var(--ember);width:18px;height:18px;flex:none}
.pick .ic{font-size:24px;flex:none;width:1.4em;text-align:center}
.pick .tx b{font-weight:400;color:var(--tc);font-family:var(--label)}
.pick .tx small{display:block;color:var(--dim);font-size:15px;line-height:1.3}
.rec{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.recrow{display:grid;grid-template-columns:1fr auto auto auto auto;gap:2px 10px;align-items:baseline;padding:7px 10px;border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:10px;background:var(--ink);font-size:15px}
.recrow>b{font-family:var(--label);font-weight:400;color:var(--tc)}
.recrow span b{color:var(--bone)}
.recrow span{color:var(--dim)}
.recrow small{grid-column:1/-1;color:var(--dim);font-size:13px}
.recrow .ok{color:var(--out)}.recrow .meh{color:#ffb35c}.recrow .bad{color:#ff8d9b}
@media (max-width:480px){.recrow{grid-template-columns:auto auto auto 1fr}.recrow>b{grid-column:1/-1}}
.preset{margin-top:12px;border:1px solid var(--ember);border-radius:12px;padding:10px 12px;background:rgba(242,138,31,.06)}
.rchip{font-size:14px;padding:2px 9px;border-radius:999px;border:1px solid var(--tc);color:var(--tc)}
.rtab{width:100%;border-collapse:collapse;margin:8px 0;font-variant-numeric:tabular-nums;text-align:center}
.rtab th{font-family:var(--label);font-weight:400;color:var(--dim);font-size:14px;padding:4px}
.rtab th[class],.rtab td[class]{color:var(--tc)}
.rtab td{padding:4px;border-top:1px solid var(--line)}
.rtab tr.cur td{background:rgba(242,138,31,.15);font-weight:700}
.legal{font-size:14px;color:var(--dim)}

/* Grimorio */
.ring{position:relative;width:min(100%,540px);aspect-ratio:1;margin:6px auto 26px;container-type:inline-size}
.runes{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--line);stroke-width:.25}
.core{position:absolute;left:50%;top:50%;width:42%;transform:translate(-50%,-50%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.core .moon{font-size:clamp(34px,13cqw,64px);line-height:1;filter:drop-shadow(0 0 14px rgba(242,138,31,.5))}
.core .ph{font-family:var(--display);font-size:clamp(20px,6.5cqw,32px);color:var(--ember);line-height:1}
.core .st{font-size:clamp(12px,3.3cqw,16px);color:var(--dim);line-height:1.25}
.tok{position:absolute;transform:translate(-50%,-50%);width:calc(var(--sz)*1cqw);background:none;border:0;padding:0}
.medal{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 28%,var(--ink3),var(--ink));border:3px solid var(--tc,var(--line));box-shadow:0 0 0 2px var(--ink),0 0 16px color-mix(in srgb,var(--tc,var(--line)) 40%,transparent);font-size:calc(var(--sz)*.5cqw);line-height:1;position:relative}
.tname{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;white-space:nowrap;max-width:7em;overflow:hidden;text-overflow:ellipsis;font-size:clamp(11px,calc(var(--sz)*.19cqw),15px);text-shadow:0 1px 3px #000;background:rgba(14,10,21,.7);padding:0 4px;border-radius:5px}
.tok.dead .medal{filter:grayscale(1) brightness(.55)}
.tok.dead .tname{text-decoration:line-through;color:var(--dim)}
.tok.dead .medal::after{content:"†";position:absolute;inset:0;display:grid;place-items:center;font-size:.8em;color:#fff;opacity:.85;font-family:Georgia,serif}
.pip{position:absolute;right:-2px;bottom:-2px;width:.7em;height:.7em;min-width:9px;min-height:9px;border-radius:50%;background:var(--bone);border:2px solid var(--ink);font-size:inherit}
.bdg{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--ember);color:#1b0e02;font:700 12px/20px Georgia,serif;text-align:center;padding:0 4px}
.mask{position:absolute;left:-5px;top:-5px;font-size:15px;line-height:1}
.verdict{border:1px solid var(--ember);background:rgba(242,138,31,.1);border-radius:12px;padding:10px 12px;color:var(--bone)}
.legend{display:flex;gap:8px 14px;flex-wrap:wrap;justify-content:center;font-family:var(--label);font-size:14px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tc);margin-right:5px}

/* Noche */
.step{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;padding:12px;border:1px solid var(--line);border-left:4px solid var(--tc,var(--line));border-radius:12px;background:var(--ink2)}
.step.done{opacity:.5}
.step .ic{font-size:30px;line-height:1;grid-row:span 3}
.step h3{font-size:21px;color:var(--tc,var(--bone))}
.step .who{font-size:16px}
.step .rem{color:var(--dim);font-size:16px;grid-column:2/4}
.step>.btn{grid-row:1;grid-column:3}
.ntools{grid-column:2/4;display:flex;flex-direction:column;gap:6px;margin-top:4px}
.ntools .row{gap:6px}
.nres{border:1px solid var(--ember);background:rgba(242,138,31,.1);border-radius:10px;padding:7px 10px;font-size:16px}
.nwarn{color:#ffb35c;font-size:15px}
.big2{font-family:var(--display);font-size:30px;color:var(--ember);line-height:1}
.showhd{font-family:var(--label);letter-spacing:.12em;color:var(--ember);text-align:center;background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.card.mini{padding:14px 16px}.card.mini .ci{font-size:52px}.card.mini h2{font-size:24px}.card.mini .ab{font-size:16px}
.pickl{display:flex;flex-direction:column;gap:6px}
.faro{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.faro span{border:1px dashed var(--line);border-radius:8px;padding:2px 8px;font-size:15px}

/* Dia */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tile b{display:block;font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--ember);font-variant-numeric:tabular-nums}
.tile span{font-family:var(--label);font-size:13px;color:var(--dim)}
.vote{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px}
.vote[aria-pressed="true"]{border-color:var(--ember);background:rgba(242,138,31,.14)}
.vote[disabled]{opacity:.35}
.vote .ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--dim);flex:none;display:grid;place-items:center;font-size:14px}
.vote[aria-pressed="true"] .ck{background:var(--ember);border-color:var(--ember);color:#1b0e02}
.bar2{height:10px;border-radius:5px;background:var(--ink);overflow:hidden;margin:8px 0}
.bar2 i{display:block;height:100%;background:var(--ember)}
.bar2.ok i{background:var(--dem)}
.big{font-family:var(--display);font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.timer{text-align:center}
.timer .big{font-size:72px;color:var(--bone)}
.timer.end .big{color:var(--dem);animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.35}}
.nomli{padding:6px 0;border-top:1px solid var(--line);font-size:16px}

/* Hojas y tarjetas */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.overlay.center{align-items:center;padding:16px}
.bd{position:absolute;inset:0;background:rgba(5,3,9,.78)}
.sheet{position:relative;width:min(100%,560px);max-height:90%;overflow:auto;background:var(--ink2);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet .hd{display:flex;gap:8px;align-items:center}
.sheet .hd input{font-family:var(--display);font-size:24px}
.field{display:flex;flex-direction:column;gap:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:15px}
.chipb[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:#1b0e02}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pbtn{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center}
.pbtn.seen{opacity:.55}
.pbtn b{display:block;font-family:var(--display);font-weight:400;font-size:22px}
.cover{position:relative;width:min(100%,380px);text-align:center;padding:30px 20px;background:var(--ink2);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:14px;align-items:center}
.cover .ph{font-size:64px;line-height:1}
.card{position:relative;width:min(100%,360px);background:radial-gradient(120% 90% at 50% 0,#f3e8c6,var(--parch) 60%,#cdb985);color:var(--parch-ink);border-radius:18px;padding:22px 20px 20px;text-align:center;border:3px solid var(--tc);box-shadow:0 0 0 5px var(--ink),0 0 0 7px var(--tc),0 20px 50px rgba(0,0,0,.6)}
.card .ct{font-family:var(--label);letter-spacing:.14em;font-size:15px;color:var(--tc);filter:brightness(.62) saturate(1.4)}
.card .ci{font-size:84px;line-height:1.15}
.card h2{font-size:32px;color:var(--parch-ink)}
.card .ab{font-size:19px;margin:10px 0 0}
.card .ex{margin-top:12px;padding-top:10px;border-top:1px dashed rgba(43,26,18,.4);font-size:17px;text-align:left}
.cardwrap{position:relative;display:flex;flex-direction:column;gap:14px;align-items:center;max-height:100%;overflow:auto;padding:6px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;background:var(--ember);color:#1b0e02;padding:9px 16px;border-radius:12px;font-family:var(--label);max-width:90%;text-align:center}
.empty{text-align:center;padding:30px 10px;color:var(--dim)}
.flame{display:inline-block;animation:flick 2.4s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.06) rotate(2deg)}100%{transform:scale(.98) rotate(-1deg)}}

/* QR y vista de jugador */
.qrbox{position:relative;width:min(100%,400px);max-height:100%;overflow:auto;text-align:center;padding:20px 18px;background:var(--ink2);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.qrbox h2{font-size:34px;color:var(--ember);line-height:1}
.qrframe{width:min(80vw,320px);aspect-ratio:1;padding:10px;background:#fffaf0;border-radius:14px;border:3px solid var(--ember);box-shadow:0 0 0 5px var(--ink),0 0 30px rgba(242,138,31,.35)}
.qrframe svg{display:block;width:100%;height:100%}
.qrframe.big{width:min(92vw,72vh,620px);padding:6px}
.qrbox:has(.qrframe.big){width:min(100%,660px)}
.card::before,.card::after{content:"✦";position:absolute;top:10px;color:var(--tc);filter:brightness(.7);font-size:18px}
.card::before{left:14px}.card::after{right:14px}
.card .div{height:1px;background:linear-gradient(90deg,transparent,rgba(43,26,18,.55),transparent);margin:12px 0 8px}
.card .wake{font-size:16px;margin:0;opacity:.82}
.pv{position:fixed;inset:0;z-index:2;overflow:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.pvbox{width:min(100%,400px);margin:auto;display:flex;flex-direction:column;gap:16px}
.pvtop{text-align:center}
.pvtop .lbl{color:var(--ember);letter-spacing:.14em}
.scene{perspective:1500px}
.flip{display:grid;transition:transform .85s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.scene.on .flip{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex}
.face.front{transform:rotateY(180deg)}
.face .card{width:100%}
.cardback{width:100%;min-height:460px;border-radius:18px;border:3px solid var(--ember);background:radial-gradient(90% 60% at 50% 30%,#2c1e40,var(--ink) 75%);box-shadow:0 0 0 5px var(--ink),0 0 0 7px var(--line),0 24px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:26px;position:relative;overflow:hidden}
.cardback .runes{opacity:.9;stroke:var(--ember);stroke-width:.3;inset:6%;width:88%;height:88%}
.cardback>*:not(.runes){position:relative}
.cardback .hi{font-family:var(--display);font-size:38px;color:var(--bone);line-height:1.05}
.cardback .tap{font-family:var(--label);color:var(--ember);letter-spacing:.08em}
.cardback .ph{font-size:70px;line-height:1}
.goal{border:1px solid var(--tc);border-radius:14px;padding:12px 14px;background:rgba(0,0,0,.25);text-align:center}
.goal b{font-family:var(--label);font-weight:400;color:var(--tc);letter-spacing:.08em;display:block;font-size:15px}
.goal[hidden]{display:none}
.embers{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.embers span{position:absolute;bottom:-12px;width:4px;height:4px;border-radius:50%;background:var(--ember);box-shadow:0 0 8px var(--ember);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}12%{opacity:.85}100%{transform:translate(24px,-108vh);opacity:0}}
.secret{text-align:center;font-size:14px;color:var(--dim)}
.help{display:flex;flex-direction:column;gap:6px}
.helpb{align-self:flex-start;background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-family:var(--label);font-size:14px;color:var(--dim);letter-spacing:.04em}
.helpb span{color:var(--ember);font-family:Georgia,serif}

<script>
/* ============ Datos: script propio "La Noche de las Ánimas" ============ */
const TEAMS={

  out:{n:'Marginado',p:'Marginados'},

/* f = orden la primera noche, o = orden en las demás noches (0 = no despierta) */
const ROLES=[
 {id:'vidente',t:'town',i:'🔮',n:'La Vidente de Cenizas',a:'Cada noche eliges a 2 jugadores y aprendes si alguno de ellos es el Demonio. Hay un jugador bueno que siempre te aparece como Demonio.',f:90,o:70,r:'Despierta a la Vidente: elige a 2 jugadores. Asiente si alguno es el Demonio o la falsa pista; si no, niega. Envenenada o borracha: responde lo que quieras.'},
 {id:'sepulturero',t:'town',i:'⚰️',n:'El Sepulturero',a:'Cada noche, menos la primera, aprendes qué personaje fue ejecutado ese día.',f:0,o:80,r:'Si hubo ejecución hoy, enséñale la ficha del ejecutado. Si no la hubo, no lo despiertes.'},
 {id:'farolero',t:'town',i:'🏮',n:'El Farolero',a:'Cada noche aprendes cuántos de tus 2 vecinos vivos son malvados.',f:80,o:60,r:'Indica 0, 1 o 2 con los dedos según sus vecinos vivos más cercanos.'},
 {id:'bibliotecaria',t:'town',i:'📚',n:'La Bibliotecaria Embrujada',a:'La primera noche aprendes que 1 de 2 jugadores es un Marginado concreto, o que no hay ninguno.',f:60,o:0,r:'Enséñale una ficha de Marginado y señala a 2 jugadores, uno de los cuales la tiene. Si no hay Marginados, haz el gesto de cero.'},
 {id:'cronista',t:'town',i:'📜',n:'El Cronista',a:'La primera noche aprendes que 1 de 2 jugadores es un Aldeano concreto.',f:50,o:0,r:'Enséñale una ficha de Aldeano y señala a 2 jugadores, uno de los cuales la tiene.'},
 {id:'detective',t:'town',i:'🔍',n:'El Detective de Sombras',a:'La primera noche aprendes que 1 de 2 jugadores es un Esbirro concreto.',f:70,o:0,r:'Enséñale una ficha de Esbirro y señala a 2 jugadores, uno de los cuales la tiene.'},
 {id:'guardiana',t:'town',i:'🧂',n:'La Guardiana de Sal',a:'Cada noche, menos la primera, eliges a un jugador: el Demonio no puede matarlo esa noche.',f:0,o:30,r:'Despierta a la Guardiana, que señala a un jugador. Pon la marca Protegido.'},
 {id:'cazador',t:'town',i:'🗡️',n:'El Cazador de Brujas',a:'Una sola vez, de día, eliges a un jugador: si es el Demonio, muere.',f:0,o:0,r:''},
 {id:'virgen',t:'town',i:'🕯️',n:'La Virgen del Cementerio',a:'La primera vez que te nominan, si quien te nomina es un Aldeano, es ejecutado en el acto.',f:0,o:0,r:''},
 {id:'soldado',t:'town',i:'🛡️',n:'El Soldado de Paja',a:'El Demonio no puede matarte.',f:0,o:0,r:''},
 {id:'alcaldesa',t:'town',i:'🏛️',n:'La Alcaldesa Fantasma',a:'Si quedan 3 jugadores vivos y nadie es ejecutado ese día, tu equipo gana. Si el Demonio te ataca de noche, el Narrador puede hacer que muera otro jugador.',f:0,o:0,r:''},
 {id:'murcielago',t:'town',i:'🦇',n:'El Murciélago Vidente',a:'Si mueres de noche, despiertas y eliges a un jugador: aprendes su personaje.',f:0,o:50,r:'Solo si ha muerto esta noche: despiértalo, que elija a un jugador y enséñale su ficha.'},
 {id:'costurera',t:'town',i:'🧵',n:'La Costurera de Almas',a:'Una sola vez, de noche, eliges a 2 jugadores: aprendes si son del mismo bando.',f:95,o:85,r:'Si aún no usó su habilidad: que elija a 2 jugadores y asiente si están en el mismo bando. Después marca Habilidad usada.'},
 {id:'borracho',t:'out',i:'🍾',n:'El Borracho de Sidra',a:'No sabes que lo eres: crees ser un Aldeano, pero tu habilidad no funciona y la información que recibes es falsa.',f:0,o:0,r:''},
 {id:'eremita',t:'out',i:'🏚️',n:'El Eremita',a:'Las habilidades de otros pueden mostrarte como malvado, Esbirro o Demonio aunque seas bueno.',f:0,o:0,r:''},
 {id:'santo',t:'out',i:'🕊️',n:'El Santo de Trapo',a:'Si eres ejecutado, tu equipo pierde.',f:0,o:0,r:''},
 {id:'torpe',t:'out',i:'🤡',n:'El Disfrazado Torpe',a:'Cuando mueres, eliges en el acto a un jugador vivo: si es malvado, tu equipo pierde.',f:0,o:0,r:''},
 {id:'envenenadora',t:'min',i:'☠️',n:'La Envenenadora de Brebajes',a:'Cada noche eliges a un jugador: queda envenenado hasta el amanecer (su habilidad falla y su información puede ser falsa).',f:10,o:10,r:'Despierta a la Envenenadora: señala a un jugador. Pon la marca Envenenado (quita la anterior).'},
 {id:'bruja',t:'min',i:'🐈‍⬛',n:'La Bruja de los Gatos',a:'Cada noche eliges a un jugador: si nomina mañana, muere en el acto.',f:15,o:20,r:'Despierta a la Bruja: señala a un jugador. Pon la marca Embrujado (quita la anterior). Si mañana nomina, muere.'},
 {id:'espia',t:'min',i:'🕷️',n:'El Espía Tejedor',a:'Cada noche ves el grimorio. Puedes aparecer como bueno, Aldeano o Marginado.',f:20,o:90,r:'Enséñale el grimorio unos segundos.'},
 {id:'dama',t:'min',i:'👻',n:'La Dama del Velo',a:'Si hay 5 o más jugadores vivos y el Demonio muere, te conviertes en el Demonio.',f:0,o:0,r:''},
 {id:'anfitrion',t:'min',i:'🎩',n:'El Anfitrión Siniestro',a:'Preparación: hay 2 Marginados más y 2 Aldeanos menos de lo habitual.',f:0,o:0,r:'',mod:true},
 {id:'calabaza',t:'dem',i:'🎃',n:'La Calabaza Hueca',a:'Cada noche, menos la primera, eliges a un jugador: muere. Si te eliges a ti misma, mueres y un Esbirro se convierte en la Calabaza Hueca.',f:0,o:40,r:'Despierta a la Calabaza: señala a un jugador. Ese jugador muere al amanecer salvo que esté protegido o sea el Soldado de Paja.'},
 {id:'jinete',t:'dem',i:'🐴',n:'El Jinete sin Cabeza',a:'Cada noche eliges a un jugador y queda maldito. El jugador maldito la noche anterior muere en ese momento.',f:42,o:40,r:'Despierta al Jinete: señala a un jugador y pon la marca Maldito. El maldito anterior muere ahora (protegido o Soldado de Paja no mueren).'}
];
const R=Object.fromEntries(ROLES.map(r=>[r.id,r]));
const COMP={5:[3,0,1,1],6:[3,1,1,1],7:[5,0,1,1],8:[5,1,1,1],9:[5,2,1,1],10:[7,0,2,1],11:[7,1,2,1],12:[7,2,2,1],13:[9,0,3,1],14:[9,1,3,1],15:[9,2,3,1]};
const CHIPS=['Envenenado','Protegido','Maldito','Embrujado','Marcado','Falsa pista','Sin habilidad','Habilidad usada','Muere esta noche'];
const NAMES=['Ana','Biel','Carmen','Dani','Elena','Fran','Gema','Hugo'];
const KEY='grimorio-medianoche-v1';
const YOU='grimorio-medianoche-yo';

/* ============ Estado ============ */
let S;
const U={gqr:false,sheet:null,card:null,stage:0,from:'',to:'',voting:null,votes:[],confirm:null,focus:null,pick:null,show:null,nres:{},ninfo:{},nfake:{}};
const T={total:180,left:180,end:null,ac:null,done:false};

const HELP={};
function hbox(k,t,html){return `<div class="help"><button class="helpb" data-act="help" data-k="${k}" aria-expanded="${!!HELP[k]}"><span aria-hidden="true">ⓘ</span> ${t}</button><div class="helpc" ${HELP[k]?'':'hidden'}>${html}</div></div>`}
const phelp=hbox;
const HTAB={
 setup:['Cómo preparar la partida',`<ol><li><b>Jugadores:</b> añádelos en el orden en que se sientan, en círculo.</li><li><b>Personajes recomendados:</b> te dice cuántos de cada bando salen con tu número de jugadores y cuántos conviene marcar. Si dudas, aplica la selección recomendada.</li><li><b>La Noche de las Ánimas:</b> marca o desmarca a mano qué personajes pueden salir.</li><li><b>Ajustes de partida:</b> decide qué ven los jugadores en su móvil.</li><li><b>Repartir:</b> se asignan los roles al azar y aparece el QR de la partida para que cada uno vea su carta.</li></ol>`],
 grim:['Cómo usar el grimorio',`<p>Es tu tablero secreto: la mesa vista desde arriba, con el personaje de cada jugador.</p><ul><li>Toca una ficha para cambiar su personaje, marcarlo muerto, poner recordatorios (Envenenado, Protegido…) o escribir notas.</li><li>El color del borde es su bando. El punto blanco es su voto fantasma. 🎭 indica que cree ser otro personaje (el Borracho).</li><li><b>Ocultar</b>, arriba, tapa los personajes si alguien puede ver tu pantalla.</li><li>El <b>Diario del Narrador</b>, abajo, recoge todo lo que has mostrado a cada jugador.</li></ul>`],
 night:['Cómo llevar la noche',`<p>Los pasos salen en el orden en que se despierta cada personaje en juego. Ve de arriba abajo.</p><ul><li>Los botones de cada paso son atajos: eligen jugadores, ponen y quitan fichas, calculan la respuesta y enseñan cartas en grande.</li><li>Al usar un atajo o pulsar <b>Marcar</b>, el paso queda hecho y lo que le has mostrado se apunta en el <b>Diario del Narrador</b> (en el Grimorio).</li><li>⚠ avisa si quien despierta es el Borracho o está envenenado: puedes darle información falsa. Elige lo que le dices en <b>Le has dicho</b> o pulsa <b>🎭 Dar información falsa</b>; quedará marcada como falsa en tu diario.</li><li>Al final, <b>Aplicar muertes</b> mata a quien tenga «Muere esta noche».</li></ul>`],
 day:['Cómo llevar el día',`<ul><li><b>Cuenta atrás:</b> para el debate. La duración por defecto se cambia en Ajustes de partida.</li><li><b>Nominar:</b> elige quién nomina y a quién, y abre la votación. Ve marcando quién levanta la mano, en sentido horario.</li><li>Si alcanza la mitad de los vivos, va a la hoguera. Si otro le supera después, le sustituye; si empatan, no queda nadie.</li><li>Antes de anochecer, <b>Ejecutar</b> a quien esté en la hoguera.</li></ul>`],
 cards:['Para qué sirve esta pestaña',`<ul><li><b>QR de la partida:</b> un solo QR para toda la mesa. Cada jugador lo escanea, elige su nombre y ve su carta. Vuelve a enseñarlo si cambias algún rol o asiento.</li><li><b>Libro de personajes:</b> la lista de personajes que pueden salir, con un resumen de reglas.</li><li><b>Dirección de la web:</b> la dirección pública que abren los móviles. Normalmente no hace falta tocarla.</li></ul>`]
};
const defCfg=()=>({notes:true,off:true,tmin:3});
function fresh(){return{v:1,players:NAMES.map((n,i)=>({id:i+1,name:n,role:null,shown:null,alive:true,ghost:true,rem:[],note:'',seen:false})),nextId:NAMES.length+1,pool:ROLES.map(r=>r.id),started:false,day:1,night:true,done:{},noms:[],nomd:[],nomr:[],block:null,bluffs:[],hide:false,tab:'setup',log:[],cfg:defCfg()}}
function load(){try{const j=localStorage.getItem(KEY);if(j){const s=JSON.parse(j);if(s&&s.v===1)return s}}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=id=>S.players.find(p=>p.id===+id);
const teamOf=p=>p&&p.role&&R[p.role]?R[p.role].t:null;
const aliveN=()=>S.players.filter(p=>p.alive).length;
const thr=()=>Math.ceil(aliveN()/2);
const names=a=>a.length?a.map(p=>esc(p.name)).join(', '):'nadie';
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(m){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function commit(){save();render()}

/* ============ Lógica de partida ============ */
function deal(){
  const n=S.players.length,c=COMP[n];
  if(!c){toast('Hacen falta entre 5 y 15 jugadores');return}
  let [Tn,O,M,D]=c;
  const pool=t=>shuffle(ROLES.filter(r=>r.t===t&&S.pool.includes(r.id)));
  const dem=pool('dem'),min=pool('min');
  if(dem.length<D){toast('Activa al menos un Demonio');return}
  if(min.length<M){toast('Activa al menos '+M+' Esbirro'+(M>1?'s':''));return}
  const out=pool('out'),town=pool('town');
  let minPick=min.slice(0,M);
  if(minPick.some(r=>r.mod)&&(out.length<O+2||Tn<3)){const alt=min.filter(r=>!r.mod);if(alt.length>=M)minPick=alt.slice(0,M)}
  if(minPick.some(r=>r.mod)){O+=2;Tn-=2}
  if(out.length<O){toast('Faltan Marginados activos: necesitas '+O);return}
  if(town.length<Tn){toast('Faltan Aldeanos activos: necesitas '+Tn);return}
  const chosen=[...dem.slice(0,D),...minPick,...out.slice(0,O),...town.slice(0,Tn)];
  const used=new Set(chosen.map(r=>r.id));
  const order=shuffle(chosen);
  S.players.forEach((p,i)=>{p.role=order[i].id;p.shown=null;p.alive=true;p.ghost=true;p.rem=[];p.seen=false});
  const spare=[...shuffle(ROLES.filter(r=>r.t==='town'&&!used.has(r.id)&&S.pool.includes(r.id))),...shuffle(ROLES.filter(r=>r.t==='town'&&!used.has(r.id)&&!S.pool.includes(r.id)))];
  S.players.forEach(p=>{if(p.role==='borracho'){const r=spare.shift()||shuffle(ROLES.filter(x=>x.t==='town'))[0];p.shown=r.id;used.add(r.id)}});
  const bf=r=>(r.t==='town'||r.t==='out')&&!used.has(r.id);
  S.bluffs=[...shuffle(ROLES.filter(r=>bf(r)&&S.pool.includes(r.id))),...shuffle(ROLES.filter(r=>bf(r)&&!S.pool.includes(r.id)))].slice(0,3).map(r=>r.id);
  Object.assign(S,{started:true,gid:newGid(),exec:null,log:[],day:1,night:true,done:{},noms:[],nomd:[],nomr:[],block:null,tab:'grim'});
  U.sheet=null;U.voting=null;U.votes=[];U.gqr=true;U.nres={};U.ninfo={};U.nfake={};
  commit();toast('Roles repartidos. Enseña el QR de la partida');
}
function resetGame(){
  S.started=false;S.gid=null;S.exec=null;S.log=[];S.day=1;S.night=true;S.done={};S.noms=[];S.nomd=[];S.nomr=[];S.block=null;S.bluffs=[];S.tab='setup';
  S.players.forEach(p=>{p.role=null;p.shown=null;p.alive=true;p.ghost=true;p.rem=[];p.note='';p.seen=false});
  U.sheet=null;U.voting=null;U.votes=[];U.gqr=false;commit();
}
function phase(){
  U.nres={};U.ninfo={};U.nfake={};
  if(S.night){S.night=false;S.done={};S.noms=[];S.nomd=[];S.nomr=[];S.block=null;U.voting=null;U.votes=[];S.tab='day'}
  else{S.night=true;S.day++;S.done={};S.tab='night'}
  commit();
}
function verdict(){
  if(!S.started)return '';
  const demAlive=S.players.some(p=>p.alive&&teamOf(p)==='dem');
  if(!demAlive)return 'No queda ningún Demonio vivo. Ganan los Aldeanos, salvo que una Dama del Velo siga viva con 5 o más jugadores en pie.';
  if(aliveN()<=2)return 'Quedan 2 jugadores vivos y el Demonio sigue entre ellos. Ganan los malvados.';
  return '';
}

/* ============ Pasos de la noche ============ */
function nightSteps(){
  const first=S.day===1&&S.night,out=[];
  out.push({id:'dusk',o:0,i:'🌑',n:'Anochecer',txt:'Pide a todos que cierren los ojos.'});
  ROLES.forEach(r=>{
    const ord=first?r.f:r.o;if(!ord)return;
    const hs=S.players.filter(p=>p.role===r.id||p.shown===r.id);
    if(!hs.some(p=>p.alive))return;
    out.push({id:r.id,o:ord,i:r.i,n:r.n,t:r.t,holders:hs,txt:r.r});
  });
  if(first){
    const mins=S.players.filter(p=>teamOf(p)==='min'),dems=S.players.filter(p=>teamOf(p)==='dem');
    if(mins.length)out.push({id:'minfo',o:30,i:'🕸️',n:'Los Esbirros se reconocen',t:'min',txt:'Despierta a los Esbirros a la vez. Señala al Demonio: '+names(dems)+'. Esbirros: '+names(mins)+'.'});
    if(dems.length)out.push({id:'dinfo',o:41,i:'🩸',n:'El Demonio conoce a sus Esbirros',t:'dem',txt:'Despierta al Demonio. Señala a sus Esbirros: '+names(mins)+'. Enséñale 3 faroles (roles buenos que no están en juego).',bluffs:true});
  }
  out.push({id:'dawn',o:999,i:'🌅',n:'Amanecer',txt:'Abre los ojos y anuncia quién ha muerto esta noche. Marca los fallecidos en el grimorio.'});
  return out.sort((a,b)=>a.o-b.o);
}

/* ============ Vistas ============ */
const EYE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
function header(){
  const lab=S.started?(S.night?'Noche ':'Día ')+S.day:'Preparación';

}
function nav(){
  const tabs=[['setup','✎','Preparar'],['grim','❂','Grimorio'],['night','☾','Noche'],['day','☀','Día'],['cards','♦','Tarjetas']];

function needStart(){return `<div class="panel empty"><p>Todavía no hay roles repartidos.</p><button class="btn primary" data-act="tab" data-k="setup">Ir a Preparar</button></div>`}

/* ---- Recomendaciones de personajes según jugadores ---- */
const PRESETS=[
 {max:6,n:'Mesa pequeña (5–6)',d:'Personajes sencillos y con información clara. Sin Anfitrión: con tan pocos jugadores dejaría casi sin Aldeanos.',
  ids:['vidente','farolero','cronista','detective','bibliotecaria','guardiana','soldado','borracho','santo','envenenadora','espia','calabaza']},
 {max:9,n:'Mesa media (7–9)',d:'Entra el Sepulturero y la Virgen para dar juego de día, más Marginados y un segundo Demonio para variar.',
  ids:['vidente','farolero','cronista','detective','bibliotecaria','guardiana','sepulturero','soldado','virgen','borracho','santo','eremita','envenenadora','bruja','espia','calabaza','jinete']},
 {max:12,n:'Mesa grande (10–12)',d:'Casi todo el script. Entra el Anfitrión, que cambia el reparto, y la Dama del Velo, que alarga la partida.',
  ids:['vidente','farolero','cronista','detective','bibliotecaria','guardiana','sepulturero','soldado','virgen','cazador','alcaldesa','costurera','borracho','santo','eremita','torpe','envenenadora','bruja','espia','dama','anfitrion','calabaza','jinete']},
 {max:99,n:'Mesa muy grande (13–15)',d:'Todos los personajes del script.',ids:ROLES.map(r=>r.id)}
];
const presetFor=n=>PRESETS.find(p=>n<=p.max);
function recNeed(n){
  const c=COMP[n];if(!c)return null;
  const [Tn,O,M]=c,anf=S.pool.includes('anfitrion');
  return {town:Math.min(13,Tn+3),out:Math.min(4,O+(anf?2:0)+1),min:Math.min(5,M+1),dem:n>=7?2:1,c};
}
function vRec(){
  const n=S.players.length,c=COMP[n];
  if(!c)return `<section class="panel"><h2>Personajes recomendados</h2><p class="verdict">Con ${n} jugadores no hay reparto estándar. Hacen falta entre 5 y 15.</p></section>`;
  const need=recNeed(n),pr=presetFor(n);
  const why={town:'los que salen + 3 para los faroles del Demonio',out:'los que salen + 1 de margen'+(S.pool.includes('anfitrion')?' (+2 por si sale el Anfitrión)':''),min:'los que salen + 1, para que no se sepa cuál hay',dem:n>=7?'2 para que no se sepa cuál es':'con 1 basta'};
  const rows=['town','out','min','dem'].map((t,k)=>{
    const have=ROLES.filter(r=>r.t===t&&S.pool.includes(r.id)).length,inp=c[k],ok=have>=need[t];
    return `<div class="recrow t-${t}"><b>${TEAMS[t].p}</b><span>salen <b>${inp}</b></span><span>marcados <b>${have}</b></span><span>recomendado <b>${need[t]}+</b></span><span class="${ok?'ok':(have>=inp?'meh':'bad')}">${ok?'✓':(have>=inp?'⚠ justo':'✕ faltan')}</span><small>${why[t]}</small></div>`;
  }).join('');
  const same=pr.ids.length===S.pool.length&&pr.ids.every(id=>S.pool.includes(id));
  const table=Object.keys(COMP).map(Number).map(k=>{const [a,b,m,d]=COMP[k],p=presetFor(k);return `<tr${k===n?' class="cur"':''}><td>${k}</td><td class="t-town">${a}</td><td class="t-out">${b}</td><td class="t-min">${m}</td><td class="t-dem">${d}</td><td>${p.ids.length}</td></tr>`}).join('');
  return `<section class="panel"><h2>Personajes recomendados</h2>
   ${hbox('rec','Por qué marcar más de los que salen',`<p>Si marcas justo los personajes que salen, todos sabrán qué hay en juego y el Demonio no tendrá faroles creíbles. Por eso se recomienda marcar algunos más:</p><ul><li><b>Aldeanos:</b> los que salen + 3, porque el Demonio recibe 3 personajes buenos que no están en juego para mentir.</li><li><b>Marginados y Esbirros:</b> uno más de los que salen, para que no se sepa cuál ha tocado.</li><li><b>Demonios:</b> dos a partir de 7 jugadores.</li></ul>`)}
   <p class="sub">Con <b>${n} jugadores</b> entran en juego:</p>
   <div class="comp"><span class="t-town">${c[0]} Aldeanos</span><span class="t-out">${c[1]} Marginados</span><span class="t-min">${c[2]} Esbirro${c[2]>1?'s':''}</span><span class="t-dem">${c[3]} Demonio</span></div>
   <p class="sub" style="margin-top:8px">Conviene marcar más personajes de los que salen: así nadie puede deducir qué hay en juego y el Demonio tiene 3 faroles (personajes buenos que no están). Si sale el Anfitrión Siniestro, +2 Marginados y −2 Aldeanos.</p>
   <div class="rec">${rows}</div>
   <div class="preset"><div class="lbl" style="color:var(--ember)">SELECCIÓN RECOMENDADA · ${esc(pr.n).toUpperCase()}</div><p class="sub" style="margin:4px 0">${esc(pr.d)} ${pr.ids.length} personajes.</p>
    <div class="chips">${pr.ids.map(id=>`<span class="rchip t-${R[id].t}">${R[id].i} ${esc(R[id].n)}</span>`).join('')}</div>
    <button class="btn ${same?'':'primary'} block" style="margin-top:10px" data-act="preset" ${same?'disabled':''}>${same?'✓ Ya tienes esta selección':'Aplicar selección recomendada'}</button></div>
   <details class="rules" style="margin-top:10px"><summary>Tabla de reparto (5–15 jugadores)</summary>
    <table class="rtab"><thead><tr><th>Jug.</th><th class="t-town">Ald.</th><th class="t-out">Marg.</th><th class="t-min">Esb.</th><th class="t-dem">Dem.</th><th>Recom.</th></tr></thead><tbody>${table}</tbody></table>
    <p class="sub" style="font-size:14px">Ald./Marg./Esb./Dem.: cuántos salen en juego. Recom.: personajes marcados en la selección recomendada.</p></details>
  </section>`;
}

function vCfg(){
  const c=S.cfg,tg=(k,t,d,dis)=>`<label class="pick"><input type="checkbox" data-chg="cfg" data-k="${k}" ${c[k]?'checked':''} ${dis?'disabled':''}><span class="tx"><b style="color:var(--bone)">${t}</b><small>${d}</small></span></label>`;
  return `<section class="panel"><h2>Ajustes de partida</h2><p class="sub">Afectan a lo que ven los jugadores al escanear el QR de la partida. Si los cambias con la partida empezada, vuelve a enseñar el QR.</p>
   ${hbox('cfg','Qué hace cada ajuste',`<ul><li><b>Notas personales:</b> bloc de notas y sospechas en el móvil de cada jugador. No las ve nadie más, ni tú.</li><li><b>Personajes que no entran:</b> en el libro, enseña también los que has dejado fuera, atenuados.</li></ul>`)}
   ${tg('notes','Notas personales para los jugadores','Bloc de notas y sospechas por jugador en el móvil de cada uno. Son privadas y se borran en cada partida.')}
   ${tg('off','Enseñar en el libro los personajes que no entran','Si lo quitas, el libro de personajes solo muestra los que pueden salir.')}
   <div class="field" style="margin-top:8px"><label class="lbl" for="cfgt">Duración del debate por defecto</label><select id="cfgt" data-chg="cfg" data-k="tmin">${[1,2,3,5,7,10].map(m=>`<option value="${m}" ${c.tmin===m?'selected':''}>${m} min</option>`).join('')}</select></div>
  </section>`;
}

function vSetup(){
  const n=S.players.length,c=COMP[n];
  const plist=S.players.map((p,i)=>`<li><span class="seat">${i+1}</span><span class="nm">${esc(p.name)}</span><button class="btn sm" data-act="up" data-id="${p.id}" aria-label="Subir a ${esc(p.name)}" ${i===0?'disabled':''}>↑</button><button class="btn sm" data-act="down" data-id="${p.id}" aria-label="Bajar a ${esc(p.name)}" ${i===n-1?'disabled':''}>↓</button><button class="btn sm danger" data-act="rm" data-id="${p.id}" aria-label="Quitar a ${esc(p.name)}">✕</button></li>`).join('');
  const groups=['town','out','min','dem'].map(t=>{
    const items=ROLES.filter(r=>r.t===t);
    const on=items.filter(r=>S.pool.includes(r.id)).length;
    return `<details class="t-${t}" ${t==='min'||t==='dem'?'open':''}><summary class="lbl" style="cursor:pointer;padding:6px 0;color:var(--tc)">${TEAMS[t].p} · ${on}/${items.length}</summary>${items.map(r=>`<label class="pick t-${t}"><input type="checkbox" data-chg="pool" data-id="${r.id}" ${S.pool.includes(r.id)?'checked':''}><span class="ic">${r.i}</span><span class="tx"><b>${esc(r.n)}</b><small>${esc(r.a)}</small></span></label>`).join('')}</details>`;
  }).join('');
  const live=S.started?`<section class="panel" style="border-color:var(--ember)"><h2>Partida en curso</h2><p class="sub">Enseña el QR de la partida a la mesa: cada jugador lo escanea, elige su nombre y ve su carta.</p><button class="btn primary block" style="margin-top:8px" data-act="gameqr">▣ Mostrar QR de la partida</button></section>`:'';
  return `<div class="wrap">
  ${live}
  <button class="btn block" data-act="bookqr">📖 QR del libro de personajes</button>
  <section class="panel"><h2>Jugadores</h2><p class="sub">El orden es el de los asientos, en círculo. Los nombres son de ejemplo: cámbialos por los de tu mesa.</p>
   <ul class="plist">${plist}</ul>
   <div class="row"><input type="text" id="newname" placeholder="Nombre del jugador" maxlength="24" autocomplete="off" style="flex:1;min-width:140px"><button class="btn" data-act="add">Añadir</button></div>
   <div class="row" style="margin-top:8px"><button class="btn sm" data-act="shuf">Barajar asientos</button><button class="btn sm danger" data-act="clear">Vaciar lista</button></div>
  </section>
  ${vRec()}
  <section class="panel"><h2>La Noche de las Ánimas</h2><p class="sub">Script propio con ${ROLES.length} personajes. Marca o desmarca a mano los que quieras que puedan salir en la partida.</p>${groups}</section>
  ${vCfg()}
  <button class="btn primary block" data-act="deal">${S.started?'Volver a repartir roles':'Repartir roles y empezar'}</button>
  ${S.started?'<button class="btn danger block" data-act="reset">Nueva partida (borrar roles)</button>':''}
  <p class="legal">Proyecto de aficionados con personajes originales, inspirado en la mecánica de Blood on the Clocktower. No está afiliado a The Pandemonium Institute.</p>
  </div>`;
}

function ringSVG(){
  let t='';
  for(let i=0;i<48;i++){const a=i*Math.PI/24,r1=i%4===0?45.6:47,r2=48.6;t+=`<line x1="${(50+r1*Math.cos(a)).toFixed(2)}" y1="${(50+r1*Math.sin(a)).toFixed(2)}" x2="${(50+r2*Math.cos(a)).toFixed(2)}" y2="${(50+r2*Math.sin(a)).toFixed(2)}"/>`}
  return `<svg class="runes" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48.6"/><circle cx="50" cy="50" r="27"/><circle cx="50" cy="50" r="25.6" stroke-dasharray="2.5 1.4"/>${t}</svg>`;
}
function narrLog(){
  if(!S.started||!(S.log||[]).length)return '';
  const ix=id=>S.players.findIndex(p=>p.id===id),cv=v=>Array.isArray(v)?v.map(cv):v&&v.p!=null?ix(v.p):v&&v.r!=null?ROLES.findIndex(r=>r.id===v.r):v;
  const sv=[PV.G,PV.i];PV.G={ps:S.players.map(p=>[p.name])};PV.i=-1;
  let last=-1,h='';
  S.log.slice().sort((a,b)=>(a.n*2+(a.d?1:0))-(b.n*2+(b.d?1:0))).forEach(e=>{
    const key=e.n*2+(e.d?1:0),hd=e.to==='all'?[0,0,-1]:[0,0,[]];
    if(key!==last){last=key;h+=`<div class="lbl" style="margin-top:8px">${phaseName(key).toUpperCase()}</div>`}
    const who=e.to==='all'?'Toda la mesa':names(e.to.map(P).filter(Boolean)),f=isFalse(e);
    h+=`<div class="hev ${e.to==='all'?'pub':''} ${f?'fake':''}"><span class="sub">${who} ${e.w==='b'?'(Borracho)':e.w==='e'?'(envenenado)':''}</span><br>${histText([key,e.k,hd[2],...e.a.map(cv)])}${f?`<div class="hfx"><span class="ftag">🎭 Falsa</span> <span class="sub">Verdad: ${histText([key,e.k,hd[2],...e.t.map(cv)])}</span></div>`:''}</div>`;
  });
  [PV.G,PV.i]=sv;
  const nf=S.log.filter(isFalse).length;
  return `<details class="rules"><summary>📜 Diario del Narrador · ${S.log.length} sucesos${nf?' · '+nf+' falsos':''}</summary><p class="sub" style="font-size:14px">Todo lo que has mostrado, a quién y si era falso. Los jugadores solo ven lo suyo, en segunda persona.</p><div class="lst" style="gap:6px">${h}</div></details>`;
}
function vGrim(){
  const n=S.players.length;if(!n)return `<div class="panel empty">No hay jugadores. Añádelos en Preparar.</div>`;
  const sz=Math.min(19,215/Math.max(n,5)),R0=37;
  const toks=S.players.map((p,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/n,x=50+R0*Math.cos(a),y=50+R0*Math.sin(a);
    const r=p.role?R[p.role]:null,tm=r?r.t:null;
    const glyph=S.hide?'☾':(r?r.i:'?');
    const tc=S.hide||!tm?'var(--dim)':`var(--${tm})`;
    return `<button class="tok ${p.alive?'':'dead'}" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%;--sz:${sz.toFixed(2)};--tc:${tc}" data-act="sheet" data-id="${p.id}" aria-label="${esc(p.name)}${r&&!S.hide?', '+esc(r.n):''}${p.alive?'':', muerto'}"><span class="medal">${glyph}${!p.alive&&p.ghost?'<i class="pip" title="Conserva su voto fantasma"></i>':''}${p.rem.length&&!S.hide?`<span class="bdg">${p.rem.length}</span>`:''}${!S.hide&&p.shown?'<span class="mask">🎭</span>':''}</span><span class="tname">${esc(p.name)}</span></button>`;
  }).join('');
  const v=verdict();
  return `<div class="wrap">
   ${v?`<div class="verdict" role="status">${esc(v)}</div>`:''}
   <div class="ring ${S.hide?'veil':''}">${ringSVG()}${toks}<div class="core"><div class="moon">${S.night?'🌕':'🎃'}</div><div class="ph">${S.started?(S.night?'Noche ':'Día ')+S.day:'Sin repartir'}</div><div class="st">${aliveN()} vivos · hacen falta ${thr()} votos</div>${S.hide?'<div class="veiltag">◉ Roles ocultos</div>':''}</div></div>
   <div class="legend"><span class="t-town"><i></i>Aldeano</span><span class="t-out"><i></i>Marginado</span><span class="t-min"><i></i>Esbirro</span><span class="t-dem"><i></i>Demonio</span><span>● voto fantasma</span><span>🎭 cree ser otro</span></div>
   ${S.started?`<button class="btn primary block" data-act="phase">${S.night?'☀ Amanece':'☾ Anochece'}</button>`:needStart()}
   <p class="sub" style="text-align:center">Toca una ficha para cambiar su rol, marcarla muerta o poner recordatorios.</p>
   ${narrLog()}
  </div>`;
}

/* ---- Atajos de la noche ---- */
const isEvil=p=>['min','dem'].includes(teamOf(p));
const holdersOf=id=>S.players.filter(p=>p.role===id||p.shown===id);
function markOnly(chip,id){S.players.forEach(p=>{const i=p.rem.indexOf(chip);if(i>=0)p.rem.splice(i,1)});const p=P(id);if(p&&!p.rem.includes(chip))p.rem.push(chip)}
function addChip(p,chip){if(!p.rem.includes(chip))p.rem.push(chip)}
const safe=p=>p.rem.includes('Protegido')||(p.role==='soldado'&&!p.rem.includes('Envenenado'));
function tokenCard(rid,mini){const r=R[rid];if(!r)return '';return `<div class="card ${mini?'mini':''}" style="--tc:var(--${r.t})"><div class="ct">${TEAMS[r.t].n.toUpperCase()}</div><div class="ci">${r.i}</div><h2>${esc(r.n)}</h2><p class="ab">${esc(r.a)}</p></div>`}
/* Diario del Narrador: cada suceso guarda a quién se mostró (ids de jugador o 'all'). Refs: {p:id} jugador, {r:id} personaje. */
const pr=id=>({p:id}),rr=id=>({r:id});
function relog(st){if(logGet(st)){S.log=S.log.filter(e=>!(e.n===S.day&&!e.d&&e.s===st));autoLog(st)}}
const hid=st=>holdersOf(st).filter(p=>p.alive||st==='murcielago').map(p=>p.id);
function logSet(st,k,to,a,t){
  S.log=(S.log||[]).filter(e=>!(e.n===S.day&&!e.d&&e.s===st));
  if(to!=='all'&&!to.length)return;
  const ps=to==='all'?[]:to.map(P).filter(Boolean),w=ps.some(p=>p.shown===st&&p.role!==st)?'b':ps.some(p=>p.rem.includes('Envenenado'))?'e':'';
  S.log.push({n:S.day,s:st,k,to,a,t:JSON.parse(JSON.stringify(t||a)),w});
}
const isFalse=e=>!!e.t&&JSON.stringify(e.a)!==JSON.stringify(e.t);
/* Información falsa para Bibliotecaria, Cronista y Detective: un personaje del tipo y 2 jugadores que no lo tienen */
function genFake(id){
  const t={bibliotecaria:'out',cronista:'town',detective:'min'}[id],hs=holdersOf(id).map(p=>p.id);
  const r=shuffle(ROLES.filter(x=>x.t===t))[0],c=shuffle(S.players.filter(p=>!hs.includes(p.id)&&p.role!==r.id&&p.shown!==r.id)).slice(0,2);
  return {r:r.id,ids:c.map(p=>p.id),fake:true};
}
const infoArr=inf=>inf.none?[]:[rr(inf.r),...inf.ids.map(pr)];
const logGet=st=>(S.log||[]).find(e=>e.n===S.day&&!e.d&&e.s===st);
function faroInfo(p){const al=S.players.filter(q=>q.alive||q.id===p.id),i=al.indexOf(p);if(al.length<3)return null;const nb=[al[(i-1+al.length)%al.length],al[(i+1)%al.length]];return{nb,n:nb.filter(isEvil).length}}
function autoLog(st){
  if(logGet(st))return;
  const dems=S.players.filter(p=>teamOf(p)==='dem'),mins=S.players.filter(p=>teamOf(p)==='min');
  switch(st){
    case 'minfo':logSet(st,'m',mins.map(p=>p.id),[dems.map(p=>pr(p.id)),mins.map(p=>pr(p.id))]);break;
    case 'dinfo':logSet(st,'d',dems.map(p=>p.id),[mins.map(p=>pr(p.id)),S.bluffs.map(rr)]);break;
    case 'espia':logSet(st,'e',hid(st),[]);break;
    case 'farolero':{const h=holdersOf(st).find(p=>p.alive),f=h&&faroInfo(h);if(f)logSet(st,'f',[h.id],[f.n]);break}
    case 'sepulturero':{const e=S.exec&&S.exec.day===S.day-1?P(S.exec.id):null;if(e)logSet(st,'s',hid(st),[pr(e.id),rr(e.role)]);break}
    case 'bibliotecaria':case 'cronista':case 'detective':{const inf=U.ninfo[st],fk=U.nfake[st];if(inf)logSet(st,'i',hid(st),infoArr(fk||inf),infoArr(inf));break}
  }
}
const PICKS={
  envenenadora:{s:'envenenadora',n:1,t:'¿A quién envenena?',run:([a])=>{markOnly('Envenenado',a);logSet('envenenadora','p',hid('envenenadora'),[pr(a)]);return `☠️ <b>${esc(P(a).name)}</b> queda envenenado (se quitó la marca anterior).`}},
  bruja:{s:'bruja',n:1,t:'¿A quién embruja?',run:([a])=>{markOnly('Embrujado',a);logSet('bruja','w',hid('bruja'),[pr(a)]);return `🐈‍⬛ <b>${esc(P(a).name)}</b> queda embrujado: si nomina mañana, muere en el acto.`}},
  guardiana:{s:'guardiana',n:1,t:'¿A quién protege?',run:([a])=>{markOnly('Protegido',a);logSet('guardiana','g',hid('guardiana'),[pr(a)]);return `🧂 <b>${esc(P(a).name)}</b> está protegido esta noche.`}},
  calabaza:{s:'calabaza',n:1,t:'¿A quién ataca la Calabaza?',run:([a])=>{
    const p=P(a);logSet('calabaza','k',hid('calabaza'),[pr(a)]);
    if(teamOf(p)==='dem'&&p.role==='calabaza'){addChip(p,'Muere esta noche');const mins=S.players.filter(q=>q.alive&&teamOf(q)==='min');return `🎃 Se ha elegido a sí misma: <b>${esc(p.name)}</b> muere. ${mins.length?'Convierte a un Esbirro vivo ('+names(mins)+') en la Calabaza Hueca desde su ficha en el grimorio y avísale.':'No quedan Esbirros vivos.'}`}
    if(safe(p))return `🛡️ <b>${esc(p.name)}</b> no muere: ${p.rem.includes('Protegido')?'está protegido':'es el Soldado de Paja'}.`;
    addChip(p,'Muere esta noche');
    return `🎃 <b>${esc(p.name)}</b> morirá al amanecer.${p.role==='alcaldesa'&&!p.rem.includes('Envenenado')?' Es la Alcaldesa: puedes hacer que muera otro jugador en su lugar.':''}`}},
  jinete:{s:'jinete',n:1,t:'¿A quién maldice el Jinete?',run:([a])=>{
    logSet('jinete','h',hid('jinete'),[pr(a)]);const prev=S.players.find(q=>q.rem.includes('Maldito'));let t='';

function genInfo(id){
  const t={bibliotecaria:'out',cronista:'town',detective:'min'}[id],hs=holdersOf(id).map(p=>p.id);

  if(!c.length)return {none:true};
  const a=shuffle(c)[0],b=shuffle(S.players.filter(p=>p.id!==a.id&&!hs.includes(p.id)))[0];
  return {r:a.role,ids:shuffle([a,b].filter(Boolean)).map(p=>p.id)};
}
function nightTools(s){
  const pb=(k,l)=>`<button class="btn sm" data-act="npick" data-k="${k}">${l}</button>`;
  const sb=(k,l,extra='')=>`<button class="btn sm" data-act="nshow" data-k="${k}" ${extra}>${l}</button>`;
  let b='',warn='';
  if(s.holders){
    const bad=s.holders.filter(p=>(p.shown===s.id&&p.role!==s.id)||p.rem.includes('Envenenado'));
    if(bad.length)warn=`<div class="nwarn">⚠ ${names(bad)} ${bad.length>1?'están':'está'} borracho o envenenado: su habilidad falla y puedes darle información falsa.</div>`;
  }
  switch(s.id){
    case 'envenenadora':b=pb('envenenadora','☠️ Elegir envenenado');break;
    case 'bruja':b=pb('bruja','🐈‍⬛ Elegir embrujado');break;
    case 'guardiana':b=pb('guardiana','🧂 Elegir protegido');break;
    case 'calabaza':b=pb('calabaza','🎃 Elegir víctima');break;
    case 'jinete':b=pb('jinete','🐴 Elegir maldito');break;
    case 'vidente':b=pb('vidente','🔮 Elegir 2 jugadores')+(S.players.some(p=>p.rem.includes('Falsa pista'))?'':pb('vidente_fp','Poner falsa pista'));break;
    case 'costurera':b=U.nres.costurera?'':s.holders.some(p=>p.rem.includes('Habilidad usada'))?'<span class="sub">Ya usó su habilidad: no la despiertes.</span>':pb('costurera','🧵 Elegir 2 jugadores');break;
    case 'murcielago':b=s.holders.some(p=>p.rem.includes('Muere esta noche'))?pb('murcielago','🦇 Elegir jugador'):'<span class="sub">No muere esta noche: no lo despiertes.</span>';break;
    case 'farolero':{
      const out=s.holders.filter(p=>p.alive).map(p=>{
        const fi=faroInfo(p);
        if(!fi)return `${esc(p.name)}: no tiene 2 vecinos vivos.`;
        const {nb,n}=fi;

        return `🏮 Vecinos de ${esc(p.name)}: ${names(nb)} → <span class="big2">${n}</span> ${n===1?'dedo':'dedos'}.${odd.length?` <span class="nwarn">${names(odd)} puede registrarse distinto (Espía/Eremita): decides tú.</span>`:''}`});
      const lg=logGet('farolero');

    case 'sepulturero':{
      const e=S.exec&&S.exec.day===S.day-1?P(S.exec.id):null;
      b=e?`<span>Hoy fue ejecutado <b>${esc(e.name)}</b>.</span>`+sb('exec','⚰️ Enseñar su ficha'):'<span class="sub">Hoy no hubo ejecución registrada: no lo despiertes.</span>';break}
    case 'bibliotecaria':case 'cronista':case 'detective':{
      const inf=U.ninfo[s.id];
      if(!inf)b=`<button class="btn sm" data-act="ninfo" data-id="${s.id}">✨ Generar información</button><button class="btn sm" data-act="nfake" data-id="${s.id}">🎭 Dar información falsa</button>`;

      else{const fk=U.nfake[s.id],sh=fk||inf;
        b=`<div class="nres ${fk?'fake':''}">${fk?'<span class="ftag">🎭 Información falsa</span> ':''}Ficha ${R[sh.r].i} <b>${esc(R[sh.r].n)}</b> · señala a ${names(sh.ids.map(P))}.${fk?`<br><span class="sub">La verdadera era: ${R[inf.r].i} ${esc(R[inf.r].n)} · ${names(inf.ids.map(P))}.</span>`:''}</div><div class="row">${sb('info','🃏 Enseñar ficha',`data-id="${s.id}"`)}${fk?`<button class="btn sm" data-act="nfake" data-id="${s.id}">↻ Otra falsa</button><button class="btn sm" data-act="ntrue" data-id="${s.id}">✓ Dar la verdadera</button>`:`<button class="btn sm" data-act="ninfo" data-id="${s.id}">↻ Otra opción</button><button class="btn sm" data-act="nfake" data-id="${s.id}">🎭 Dar información falsa</button>`}</div>`}
      break}

    case 'minfo':b=sb('demon','🩸 Enseñar quién es el Demonio');break;
    case 'dinfo':b=sb('minions','🕸️ Enseñar sus Esbirros')+sb('bluffs','🃏 Enseñar los 3 faroles');break;
    case 'dawn':{
      const d=S.players.filter(p=>p.rem.includes('Muere esta noche'));
      b=`<button class="btn sm primary" data-act="ndawn">🌅 Aplicar muertes${d.length?': '+names(d):' (nadie)'}</button>`;break}
  }
  let res=U.nres[s.id];
  const lg=logGet(s.id);
  if(lg&&(lg.k==='v'||lg.k==='c'))res=(res||'')+`<div class="row" style="margin-top:6px"><span class="sub">Le has dicho:</span>${[1,0].map(v=>`<button class="chipb" data-act="nans" data-s="${s.id}" data-v="${v}" aria-pressed="${lg.a[2]===v}">${v?'SÍ':'NO'}</button>`).join('')}${isFalse(lg)?'<span class="ftag">🎭 Información falsa</span>':''}</div>`;
  if(lg&&(lg.k==='s'||lg.k==='b'))res=(res||'')+`<div class="row" style="margin-top:6px"><label class="sub" for="nr-${s.id}">Ficha que le enseñaste:</label><select id="nr-${s.id}" class="nsel" data-chg="nrole" data-s="${s.id}">${ROLES.map(r=>`<option value="${r.id}" ${lg.a[1].r===r.id?'selected':''}>${r.i} ${esc(r.n)}</option>`).join('')}</select>${isFalse(lg)?'<span class="ftag">🎭 Información falsa</span>':''}</div>`;
  if(!b&&!warn&&!res)return '';
  return `<div class="ntools">${warn}${b?`<div class="row">${b}</div>`:''}${res?`<div class="nres">${res}</div>`:''}</div>`;
}

function vNight(){

      const tags=[];if(!p.alive)tags.push('muerto');if(p.shown===s.id&&p.role!==s.id)tags.push('es el Borracho: su habilidad falla');

function b64e(s){const b=new TextEncoder().encode(s);let x='';b.forEach(c=>x+=String.fromCharCode(c));return btoa(x).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const x=atob(t),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return new TextDecoder().decode(a)}
function cardData(p){
  const id=p.shown||p.role,idx=ROLES.findIndex(r=>r.id===id),d={r:idx,n:p.name,m:[],d:[],b:[]};
  if(idx>=0&&!p.shown){
    const t=ROLES[idx].t,dems=S.players.filter(q=>teamOf(q)==='dem'),mins=S.players.filter(q=>teamOf(q)==='min');
    if(t==='min'){d.d=dems.map(q=>q.name);d.m=mins.filter(q=>q.id!==p.id).map(q=>q.name)}
    if(t==='dem'){d.m=mins.map(q=>q.name);d.b=S.bluffs.map(b=>ROLES.findIndex(r=>r.id===b))}
  }
  return d;
}
/* El QR de la partida lleva toda la mesa: nombre y carta visible de cada jugador. Cada móvil monta su carta al elegir nombre. */
const newGid=()=>Math.random().toString(36).slice(2,8);
const cfgFlags=()=>(S.cfg.notes?4:0)|(S.cfg.off?8:0);
const encGame=()=>b64e(JSON.stringify([2,S.gid||'',poolMask().toString(36),S.bluffs.map(b=>ROLES.findIndex(r=>r.id===b)),S.players.map(p=>[p.name,ROLES.findIndex(r=>r.id===(p.shown||p.role))]),cfgFlags()]));
function decGame(t){const a=JSON.parse(b64d(t));if(a[0]!==2)throw new Error('v');return{g:a[1],mask:parseInt(a[2],36),b:a[3]||[],ps:a[4]||[],f:a[5]!=null?a[5]:12,}}
function gameCard(G,i){
  const p=G.ps[i],r=ROLES[p[1]],d={r:p[1],n:p[0],m:[],d:[],b:[]};
  const by=t=>G.ps.filter((q,j)=>j!==i&&ROLES[q[1]]&&ROLES[q[1]].t===t).map(q=>q[0]);
  if(r&&r.t==='min'){d.d=by('dem');d.m=by('min')}
  if(r&&r.t==='dem'){d.m=by('min');d.b=G.b}
  return d;
}
function defaultBase(){return /^https?:$/.test(location.protocol)?location.href.split('#')[0].split('?')[0]:''}
function baseUrl(){return String(S.baseUrl||defaultBase()).trim().split('#')[0]}
const poolMask=()=>ROLES.reduce((m,r,i)=>S.pool.includes(r.id)?m|(1<<i):m,0);
function gameUrl(){const b=baseUrl();return b&&S.started?b+'#p='+encGame():''}
function rolesUrl(){const b=baseUrl();return b?b+'#roles='+poolMask().toString(36):''}
function qrSVG(text){
  try{
    const q=qrcode(0,text.length>420?'L':'M');q.addData(text);q.make();
    const n=q.getModuleCount(),m=4;let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" role="img" aria-label="Código QR de la tarjeta"><rect width="100%" height="100%" fill="#fffaf0"/><path d="${d}" fill="#1a0f24"/></svg>`;
  }catch(e){return ''}
}

      <p class="sub" style="font-size:14px">Muestra los ${ROLES.length} personajes del script. Los que pueden salir en la partida los verá cada uno al escanear el QR de la partida.</p>
      <div class="row" style="justify-content:center"><button class="btn sm" data-act="copybook" ${url?'':'disabled'}>Copiar enlace</button><button class="btn primary" data-act="closebqr">Cerrar</button></div>
    </div></div>`;
  }
  if(U.gqr&&S.started){
    const url=gameUrl(),svg=url?qrSVG(url):'';
    h+=`<div class="overlay center" role="dialog" aria-modal="true" aria-label="QR de la partida"><div class="bd" data-act="closegqr"></div><div class="qrbox">
      <div class="lbl">La Noche de las Ánimas</div><h2>QR de la partida</h2>
      ${svg?`<div class="qrframe ${url.length>800?'big':''}">${svg}</div><p class="sub">Escanead este código con la cámara del móvil. Cada uno toca su nombre, confirma que es él y ve su carta en secreto.</p>`:`<p class="verdict">No se puede generar el QR. Revisa la dirección de la web en la pestaña Tarjetas.</p>`}
      <p class="sub" style="font-size:14px">${S.players.length} jugadores. Si cambias algún rol o asiento, vuelve a enseñar este QR.</p>
      <div class="row" style="justify-content:center"><button class="btn sm" data-act="copygame" ${url?'':'disabled'}>Copiar enlace</button><button class="btn primary" data-act="closegqr">Cerrar</button></div>
    </div></div>`;
  }
  if(U.pick){
    const k=PICKS[U.pick.k],sel=U.pick.sel;
    const list=S.players.filter(p=>(k.any||p.alive)&&(!k.good||!isEvil(p)));
    h+=`<div class="overlay" role="dialog" aria-modal="true" aria-label="${esc(k.t)}"><div class="bd" data-act="ncancel"></div><div class="sheet"><h2>${esc(k.t)}</h2><p class="sub">${k.n>1?'Elige '+k.n+' jugadores.':'Elige un jugador.'}</p>
     <div class="pickl">${list.map(p=>{const on=sel.includes(p.id),r=R[p.role];return `<button class="vote" data-act="nsel" data-id="${p.id}" aria-pressed="${on}"><span class="ck" aria-hidden="true">${on?'✓':''}</span><span style="flex:1">${esc(p.name)}${p.alive?'':' †'}</span><span class="sub">${r&&!S.hide?r.i+' '+esc(r.n):''}${p.rem.length?' · '+p.rem.map(esc).join(', '):''}</span></button>`}).join('')}</div>
     <div class="row"><button class="btn primary" data-act="nok" ${sel.length===k.n?'':'disabled'}>Confirmar</button><button class="btn" data-act="ncancel">Cancelar</button></div></div></div>`;
  }
  if(U.show){
    const v=U.show;let c='';
    const dems=S.players.filter(p=>teamOf(p)==='dem'),mins=S.players.filter(p=>teamOf(p)==='min');
    if(v.k==='role')c=`<div class="showhd">${esc(v.x||'')}</div>${tokenCard(v.r)}`;
    if(v.k==='bluffs')c=`<div class="showhd">ESTOS PERSONAJES NO ESTÁN EN JUEGO</div>${S.bluffs.map(id=>tokenCard(id,true)).join('')}`;
    if(v.k==='demon')c=`<div class="cover"><div class="lbl">ESTE ES EL DEMONIO</div><h2 style="font-size:40px;color:var(--dem)">${names(dems)}</h2>${mins.length>1?`<p class="sub">Esbirros: ${names(mins)}</p>`:''}</div>`;
    if(v.k==='minions')c=`<div class="cover"><div class="lbl">ESTOS SON TUS ESBIRROS</div><h2 style="font-size:40px;color:var(--min)">${names(mins)}</h2></div>`;
    h+=`<div class="overlay center" role="dialog" aria-modal="true"><div class="bd" data-act="nclose"></div><div class="cardwrap">${c}<button class="btn primary block" style="max-width:360px" data-act="nclose">Cerrar</button></div></div>`;
  }
  if(U.confirm){
    h+=`<div class="overlay center" role="alertdialog" aria-modal="true"><div class="bd" data-act="no"></div><div class="cover"><h2>${esc(U.confirm.t)}</h2><div class="row"><button class="btn danger" data-act="yes">Confirmar</button><button class="btn" data-act="no">Cancelar</button></div></div></div>`;
  }
  return h;
}

function render(){
  const old=$('#main'),st=old?old.scrollTop:0,sh=$('#sheetbody'),sst=sh?sh.scrollTop:0;
  const views={setup:vSetup,grim:vGrim,night:vNight,day:vDay,cards:vCards};
  const hv=HTAB[S.tab]?hbox('t-'+S.tab,HTAB[S.tab][0],HTAB[S.tab][1]):'',v=(views[S.tab]||vSetup)();
  $('#app').innerHTML=header()+`<main id="main">${v.startsWith('<div class="wrap">')?v.replace('<div class="wrap">','<div class="wrap">'+hv):`<div class="wrap">${hv}${v}</div>`}</main>`+nav()+overlays();
  const m=$('#main');if(m)m.scrollTop=st;
  const s2=$('#sheetbody');if(s2)s2.scrollTop=sst;
  if(U.focus){const f=document.getElementById(U.focus);if(f)f.focus();U.focus=null}
}

/* ============ Acciones ============ */
const A={
  tab:(d)=>{S.tab=d.k;commit()},
  hide:()=>{S.hide=!S.hide;commit()},
  add:()=>{const i=$('#newname');const v=(i&&i.value||'').trim();if(!v){toast('Escribe un nombre');return}S.players.push({id:S.nextId++,name:v,role:null,shown:null,alive:true,ghost:true,rem:[],note:'',seen:false});U.focus='newname';commit()},
  up:(d)=>{const a=S.players,i=a.findIndex(p=>p.id===+d.id);if(i>0){[a[i-1],a[i]]=[a[i],a[i-1]];commit()}},
  down:(d)=>{const a=S.players,i=a.findIndex(p=>p.id===+d.id);if(i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];commit()}},
  seatl:(d)=>A.up(d),seatr:(d)=>A.down(d),
  rm:(d)=>{S.players=S.players.filter(p=>p.id!==+d.id);commit()},
  rm2:(d)=>{U.confirm={t:'¿Quitar a '+P(d.id).name+' de la partida?',act:()=>{S.players=S.players.filter(p=>p.id!==+d.id);U.sheet=null}};render()},
  preset:()=>{const pr=presetFor(S.players.length);if(!pr)return;U.confirm={t:'¿Sustituir tu selección por la recomendada para '+S.players.length+' jugadores ('+pr.ids.length+' personajes)?',act:()=>{S.pool=pr.ids.slice()}};render()},
  shuf:()=>{S.players=shuffle(S.players);commit()},
  clear:()=>{U.confirm={t:'¿Vaciar la lista de jugadores?',act:()=>{S.players=[];S.started=false}};render()},
  deal:()=>{if(S.started){U.confirm={t:'Ya hay una partida en curso. ¿Repartir de nuevo y empezar otra?',act:deal};render()}else deal()},
  reset:()=>{U.confirm={t:'¿Borrar roles y empezar una partida nueva con estos jugadores?',act:resetGame};render()},
  yes:()=>{const c=U.confirm;U.confirm=null;if(c){c.act();commit()}else render()},
  no:()=>{U.confirm=null;render()},
  sheet:(d)=>{U.sheet=+d.id;render()},
  closesheet:()=>{U.sheet=null;render()},
  alive:(d)=>{const p=P(d.id);p.alive=!p.alive;if(p.alive)p.ghost=true;commit()},
  ghostv:(d)=>{const p=P(d.id);p.ghost=!p.ghost;commit()},
  chip:(d)=>{const p=P(d.id),i=p.rem.indexOf(d.c);if(i>=0)p.rem.splice(i,1);else p.rem.push(d.c);commit()},
  phase:()=>phase(),
  done:(d)=>{S.done[d.id]=!S.done[d.id];if(S.done[d.id])autoLog(d.id);commit()},
  showcard:(d)=>{U.card=+d.id;U.stage=0;U.sheet=null;U.gqr=false;render()},
  gameqr:()=>{U.gqr=true;U.sheet=null;U.card=null;render()},
  bookqr:()=>{U.bqr=true;render()},
  closebqr:()=>{U.bqr=false;render()},
  copybook:()=>{const u=baseUrl()+'#roles';try{navigator.clipboard.writeText(u).then(()=>toast('Enlace copiado'),()=>toast('No se pudo copiar el enlace'))}catch(e){toast('No se pudo copiar el enlace')}},
  closegqr:()=>{U.gqr=false;render()},
  copygame:()=>{const u=gameUrl();try{navigator.clipboard.writeText(u).then(()=>toast('Enlace copiado'),()=>toast('No se pudo copiar el enlace'))}catch(e){toast('No se pudo copiar el enlace')}},
  ppick:(d)=>{PV.conf=+d.i;renderPick()},
  pno:()=>{PV.conf=null;renderPick()},
  pyes:()=>{if(PV.conf==null)return;pickSeat(PV.conf);renderPlayer();const pv=$('.pv');if(pv)pv.scrollTop=0},
  pchange:()=>{try{localStorage.removeItem(YOU)}catch(e){}PV.d=null;PV.conf=null;PV.view='pick';renderPlayer()},
  plist:()=>{PV.view='list';PV.first=PV.rev;renderPlayer();const pv=$('.pv');if(pv)pv.scrollTop=0},
  pback:()=>{PV.rev=false;PV.view=PV.d?'card':'pick';renderPlayer();const pv=$('.pv');if(pv)pv.scrollTop=0},
  pview:(d)=>{PV.view=d.k;renderPlayer();const pv=$('.pv');if(pv)pv.scrollTop=0},
  nrm:(d)=>{const n=notesLoad(),e=n.s[d.j];if(e){e.r=e.r.filter(x=>x!==+d.r);if(+d.r===DRUNK)e.dr=null;notesSave(n)}renderNotes()},
  nfx:(d)=>{const n=notesLoad(),e=n.s[d.j]||(n.s[d.j]={r:[],fx:[]}),i=e.fx.indexOf(d.f);if(i>=0)e.fx.splice(i,1);else e.fx.push(d.f);notesSave(n);renderNotes()},
  pfilter:(d)=>{PV.f=d.k;renderList()},
  copyroles:()=>{const u=rolesUrl();try{navigator.clipboard.writeText(u).then(()=>toast('Enlace copiado'),()=>toast('No se pudo copiar el enlace'))}catch(e){toast('No se pudo copiar el enlace')}},
  ptoggle:()=>{
    const sc=$('#scene');if(!sc)return;
    const on=sc.classList.toggle('on');PV.rev=on;
    $('#ptog').textContent=on?'Ocultar mi rol':'Revelar mi rol';
    const g=$('#pgoal');if(g)g.hidden=!on;
    $('#ffront').setAttribute('aria-hidden',on?'false':'true');$('#fback').setAttribute('aria-hidden',on?'true':'false');
  },
  reveal:()=>{U.stage=1;render()},
  hidecard:()=>{const p=P(U.card);if(p)p.seen=true;U.card=null;U.stage=0;commit()},
  closecard:()=>{U.card=null;U.stage=0;render()},
  npick:(d)=>{U.pick={k:d.k,sel:[]};render()},
  nsel:(d)=>{const k=PICKS[U.pick.k],sel=U.pick.sel,id=+d.id,i=sel.indexOf(id);if(i>=0)sel.splice(i,1);else{if(sel.length>=k.n)sel.shift();sel.push(id)}render()},
  nok:()=>{const pk=U.pick,k=PICKS[pk.k];if(!pk||pk.sel.length!==k.n)return;U.pick=null;U.nres[k.s]=k.run(pk.sel);if(!k.nodone)S.done[k.s]=true;commit()},
  ncancel:()=>{U.pick=null;render()},
  nshow:(d)=>{
    if(d.k==='info'){const inf=U.nfake[d.id]||U.ninfo[d.id];U.show={k:'role',r:inf.r,x:'Uno de estos es este personaje: '+inf.ids.map(i=>P(i).name).join(' o ')};S.done[d.id]=true;autoLog(d.id)}
    else if(d.k==='exec'){const e=P(S.exec.id),lg=logGet('sepulturero');U.show={k:'role',r:lg?lg.a[1].r:e.role,x:'Hoy fue ejecutado este personaje'};S.done.sepulturero=true;autoLog('sepulturero')}
    else{U.show={k:d.k};const st=d.k==='demon'?'minfo':'dinfo';S.done[st]=true;autoLog(st)}
    commit()},
  nfaro:(d)=>{autoLog('farolero');const e=logGet('farolero');if(e)e.a[0]=+d.v;S.done.farolero=true;commit()},
  nans:(d)=>{const e=logGet(d.s);if(e){e.a[2]=+d.v;commit()}},
  nclose:()=>{U.show=null;render()},
  ninfo:(d)=>{U.ninfo[d.id]=genInfo(d.id);U.nfake[d.id]=null;relog(d.id);commit()},
  nfake:(d)=>{if(!U.ninfo[d.id])U.ninfo[d.id]=genInfo(d.id);U.nfake[d.id]=genFake(d.id);relog(d.id);commit()},
  ntrue:(d)=>{U.nfake[d.id]=null;relog(d.id);commit()},
  help:(d,el)=>{const c=el.nextElementSibling;if(!c)return;c.hidden=!c.hidden;HELP[d.k]=!c.hidden;el.setAttribute('aria-expanded',String(!c.hidden))},
  ndawn:()=>{
    const d=S.players.filter(p=>p.rem.includes('Muere esta noche'));
    d.forEach(p=>{p.alive=false;p.rem.splice(p.rem.indexOf('Muere esta noche'),1)});
    S.players.forEach(p=>{const i=p.rem.indexOf('Protegido');if(i>=0)p.rem.splice(i,1)});
    logSet('dawn','x','all',[d.map(p=>pr(p.id))]);
    U.nres.dawn=d.length?'Han muerto esta noche: <b>'+names(d)+'</b>. Anúncialo.':'Nadie ha muerto esta noche.';S.done.dawn=true;commit()},
  openvote:()=>{if(!U.from||!U.to)return;U.voting={from:+U.from,to:+U.to};U.votes=[];render()},
  cancelvote:()=>{U.voting=null;U.votes=[];render()},
  vote:(d)=>{const id=+d.id,i=U.votes.indexOf(id);if(i>=0)U.votes.splice(i,1);else U.votes.push(id);render()},
  closevote:()=>{
    const v=U.voting,cnt=U.votes.length,t=thr();if(!v)return;
    S.noms.push({from:v.from,to:v.to,n:cnt,t});S.nomd.push(v.to);S.nomr.push(v.from);
    U.votes.forEach(id=>{const p=P(id);if(p&&!p.alive)p.ghost=false});
    let msg=cnt+' voto'+(cnt===1?'':'s')+': no alcanza el umbral ('+t+')';
    if(cnt>=t){
      if(!S.block||cnt>S.block.n){S.block={id:v.to,n:cnt};msg=P(v.to).name+' va a la hoguera con '+cnt+' votos'}
      else if(cnt===S.block.n){S.block=null;msg='Empate: nadie queda en la hoguera'}
      else msg='No supera los '+S.block.n+' votos de la hoguera';
    }
    U.voting=null;U.votes=[];commit();toast(msg);
  },
  exec:()=>{const p=P(S.block.id);p.alive=false;S.exec={day:S.day,id:p.id};S.log.push({n:S.day,d:1,s:'exec',k:'X',to:'all',a:[pr(p.id)]});S.block=null;commit();toast(p.name+' ha sido ejecutado. Revisa si termina la partida')},
  spare:()=>{S.block=null;commit()},
  tstart:()=>{
    try{T.ac=T.ac||new (window.AudioContext||window.webkitAudioContext)();T.ac.resume&&T.ac.resume()}catch(e){}
    if(T.end){T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));T.end=null}
    else{if(T.left<=0)T.left=T.total;T.done=false;T.end=Date.now()+T.left*1000}
    render();
  },
  treset:()=>{T.end=null;T.left=T.total;T.done=false;render()},
  tset:(d)=>{T.total=T.left=+d.m*60;T.end=null;T.done=false;render()}
};
const C={
  nrole:(d,el)=>{const e=logGet(d.s);if(e){e.a[1]={r:el.value};commit()}},
  ndr:(d,el)=>{const n=notesLoad(),e=n.s[d.j];if(e){e.dr=el.value===''?null:+el.value;notesSave(n)}renderNotes()},
  nadd:(d,el)=>{if(el.value==='')return;const n=notesLoad(),e=n.s[d.j]||(n.s[d.j]={r:[],fx:[]}),v=+el.value;if(!e.r.includes(v))e.r.push(v);notesSave(n);renderNotes()},
  cfg:(d,el)=>{S.cfg[d.k]=el.type==='checkbox'?el.checked:+el.value;if(d.k==='tmin'&&!T.end){T.total=T.left=S.cfg.tmin*60;T.done=false}commit()},
  baseurl:(d,el)=>{S.baseUrl=el.value.trim();commit()},
  pool:(d,el)=>{const i=S.pool.indexOf(d.id);if(el.checked&&i<0)S.pool.push(d.id);if(!el.checked&&i>=0)S.pool.splice(i,1);commit()},
  from:(d,el)=>{U.from=el.value},
  to:(d,el)=>{U.to=el.value},
  pname:(d,el)=>{const p=P(U.sheet);if(p&&el.value.trim()){p.name=el.value.trim();commit()}},
  prole:(d,el)=>{const p=P(U.sheet);p.role=el.value||null;
    if(p.role!=='borracho')p.shown=null;
    else if(!p.shown){const used=new Set(S.players.map(q=>q.role));const c=shuffle(ROLES.filter(r=>r.t==='town'&&!used.has(r.id)))[0];if(c)p.shown=c.id}
    commit()},
  pshown:(d,el)=>{const p=P(U.sheet);p.shown=el.value||null;commit()},
  pnote:(d,el)=>{const p=P(U.sheet);p.note=el.value;save()}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName))return;
  const f=A[el.dataset.act];if(f)f(el.dataset,el);
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-chg]');if(!el)return;
  const f=C[el.dataset.chg];if(f)f(el.dataset,el);
});
document.addEventListener('input',e=>{
  if(e.target.id==='pnotes'){const n=notesLoad();n.txt=e.target.value;notesSave(n)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='newname'){e.preventDefault();A.add()}
  if(e.key==='Escape'){if(PV.conf!=null){A.pno()}else if(!S){}else if(U.confirm){A.no()}else if(U.show){A.nclose()}else if(U.pick){A.ncancel()}else if(U.bqr){A.closebqr()}else if(U.gqr){A.closegqr()}else if(U.sheet){A.closesheet()}else if(U.card){A.closecard()}}
});

/* ============ Temporizador ============ */
function beep(){
  try{
    const a=T.ac;if(!a)return;
    [0,0.35,0.7].forEach(dt=>{const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=392;o.connect(g);g.connect(a.destination);const t0=a.currentTime+dt;g.gain.setValueAtTime(.25,t0);g.gain.exponentialRampToValueAtTime(.001,t0+.3);o.start(t0);o.stop(t0+.32)});
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
setInterval(()=>{
  if(!T.end)return;
  T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  const el=$('#tmr');if(el)el.textContent=fmt(T.left);
  if(T.left<=0){T.end=null;T.done=true;beep();const b=$('#timerbox');if(b)b.classList.add('end');toast('Se acabó el tiempo')}
},250);

try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
/* ============ Arranque ============ */
function start(d){
  const m=/^#p=([\w-]+)$/.exec(location.hash),l=/^#roles(?:=([0-9a-z]+))?$/.exec(location.hash);
  if(l){PV.d=null;PV.view='list';PV.mask=l[1]?parseInt(l[1],36):null;renderList();return}
  if(m){
    try{PV.G=decGame(m[1]);PV.mask=PV.G.mask}catch(e){PV.G=null}
    if(!PV.G||!PV.G.ps.length){PV.G=null;PV.view='card';renderPlayer();return}
    PV.view='pick';
    try{
      const y=JSON.parse(localStorage.getItem(YOU)||'null'),ps=PV.G.ps;
      if(y&&y.g&&y.g===PV.G.g){const i=ps[y.i]&&ps[y.i][0]===y.n?y.i:ps.findIndex(q=>q[0]===y.n);if(i>=0)pickSeat(i)}
    }catch(e){}
    renderPlayer();return;
  }
  S=(d&&d.S)||load()||fresh();
  if(!S.players)S=fresh();
  if(S.started&&!S.gid){S.gid=newGid();save()}
  S.cfg=Object.assign(defCfg(),S.cfg||{});if(!S.log)S.log=[];
  T.total=T.left=S.cfg.tmin*60;
  render();
}
window.addEventListener('hashchange',()=>location.reload());
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({S}))}catch(e){}
try{
  if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
  else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
}catch(e){start({})}
